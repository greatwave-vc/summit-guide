uly 2008 on the east side of Rittenhouse Square, built for about $9 million in the lobby of a former Sheraton and modeled on New York's Balthazar. Tile floors, distressed mirrors and 80 sidewalk seats facing the park make it the city's best people-watching table. The menu is bistro classics: onion soup gratinee, steak frites, roast chicken, escargots. Starr won the 2017 James Beard Award for Outstanding Restaurateur. Open all day, every day; reservations via OpenTable, sidewalk tables first come, first served.","crumb":"Hotel, dining and venues"},"borromini":{"id":"borromini","name":"Borromini","category":"restaurant","address":"1805 Walnut St., Philadelphia, PA 19103","one_liner":"Starr's $20 million Italian showpiece in a former bookstore on the square.","why_it_matters":"A $20 million fit-out of a vacated big-box bookstore into a 320-seat restaurant shows how retail obsolescence on a prime square is being absorbed by hospitality; the building is owned by developer Allan Domb.","fun_facts":["The '100-layer lasagna' is not literally 100 layers, the Inquirer notes.","It is Starr's eighth restaurant around Rittenhouse Square and his first new Philadelphia opening since 2021.","Cafe banquettes were built from a salvaged bowling-alley bench."],"visit_note":"Monday Oct 19 'at leisure' dinner option, four blocks from The Bellevue; reservations via OpenTable, dinner until 10 PM Sunday to Thursday.","image_query":"Borromini restaurant Philadelphia Rittenhouse interior fresco","sources":["https://www.inquirer.com/food/restaurants/borromini-stephen-starr-rittenhouse-square-italian-20250730.html","https://inquirer.com/food/restaurants/a/borromini-stephen-starr-rittenhouse-square-20250820.html","https://www.opentable.com/r/borromini-philadelphia"],"type":"place","body":"Stephen Starr's newest Philadelphia restaurant opened August 25, 2025 in the former Barnes & Noble in the Alison Building on Rittenhouse Square, in partnership with Aimee Olexy and with Keith McNally, Starr's Pastis partner, on the design. The roughly $20 million, 16,000 sq ft space over two floors seats about 320 beneath hand-painted tin ceilings, a two-story fresco over a marble stair and a copper bar. Executive chef Julian Baker runs a menu developed with Mark Ladner, formerly of New York's Del Posto, whose 100-layer lasagna is the showpiece alongside lobster spaghetti and focaccia di Recco. It is named for the 17th-century baroque architect Francesco Borromini. Open for lunch, dinner and weekend brunch.","crumb":"Hotel, dining and venues"},"vernick-food-and-drink":{"id":"vernick-food-and-drink","name":"Vernick Food & Drink","category":"restaurant","address":"2031 Walnut St., Philadelphia, PA 19103","one_liner":"Greg Vernick's townhouse flagship; James Beard Best Chef 2017.","why_it_matters":"A chef-owned restaurant in a converted rowhouse is the quiet Philadelphia model: small footprint, long tenure, national reputation, and a second concept anchoring a new skyscraper.","fun_facts":["Vernick was a 2026 James Beard semifinalist for Outstanding Restaurateur.","Michelin lists both Vernick Food & Drink and Zahav as Recommended rather than starred."],"visit_note":"Closed Sunday and Monday, so not available for the Monday Oct 19 free evening; a 10-minute walk from The Bellevue on other nights.","image_query":"Vernick Food and Drink Philadelphia Walnut Street","sources":["https://vernickphilly.com/vernick-food-and-drink","https://www.jamesbeard.org/stories/the-2017-james-beard-award-winners","https://inquirer.com/food/restaurants/philadelphia-michelin-star-guide-announcement-updates-20251118.html"],"type":"place","body":"Greg Vernick's 2012 debut occupies a townhouse on Walnut Street near Rittenhouse Square. Vernick cooked for Jean-Georges Vongerichten in New York before coming home, and his modern American menu of toasts, raw preparations and wood-oven dishes won him the 2017 James Beard Award for Best Chef: Mid-Atlantic. The Michelin Guide listed it as Recommended, without a star, in its first Philadelphia selection in November 2025. Vernick also runs Vernick Fish in the Comcast Technology Center. Dinner Tuesday through Saturday from 5 PM; the bar opens at 4:45 PM.","crumb":"Hotel, dining and venues"},"zahav":{"id":"zahav","name":"Zahav","category":"restaurant","address":"237 St. James Pl., Philadelphia, PA 19106","one_liner":"America's benchmark modern Israeli restaurant; James Beard Outstanding Restaurant 2019.","why_it_matters":"Eighteen years in the same Society Hill building, with the owners' CookNSolo group spinning off Dizengoff (a 2025 Bib Gourmand), Laser Wolf and others: a model of a chef group growing a neighborhood rather than leaving it.","fun_facts":["The lamb shoulder recipe dates to 2006 and was loosely inspired by David Chang's bossam at Momofuku Ssam Bar.","Zahav won James Beard Outstanding Restaurant in 2019, the first Philadelphia restaurant to do so."],"visit_note":"A 10-minute taxi from The Bellevue; reservations typically book out far ahead, so consider it for the Monday Oct 19 free evening only if a table or bar seat opens.","image_query":"Zahav restaurant Philadelphia laffa taboon","sources":["https://en.wikipedia.org/wiki/Zahav","https://www.visitphilly.com/things-to-do/food-drink/zahav/","https://www.jamesbeard.org/stories/the-2017-james-beard-award-winners","https://inquirer.com/food/restaurants/philadelphia-michelin-star-guide-announcement-updates-20251118.html"],"type":"place","body":"Michael Solomonov and Steve Cook's modern Israeli restaurant opened in May 2008 in Society Hill and became a national benchmark: James Beard Outstanding Restaurant in 2019, Solomonov's Outstanding Chef award in 2017 and Best Chef: Mid-Atlantic in 2011. The Michelin Guide lists it as Recommended, without a star, in its 2025 Philadelphia selection. Laffa and hummus come from a wood-burning taboon oven, skewers are cooked over live coals, and the pomegranate-braised lamb shoulder is the signature. Tables book months ahead; the bar seats walk-ins. 'Zahav' means 'gold' in Hebrew.","crumb":"Hotel, dining and venues"},"oyster-house":{"id":"oyster-house","name":"Oyster House","category":"restaurant","address":"1516 Sansom St., Philadelphia, PA 19102","one_liner":"Third-generation seafood house, James Beard America's Classic 2026.","why_it_matters":"A reminder that long-tenured, family-owned tenants anchor Center City's side streets through every cycle; the Minks have been in the business since 1947 and on this block since 1976.","fun_facts":["Happy hour runs 4 to 6 PM Tuesday to Friday at the bar with $2 oysters.","Fried oysters with chicken salad is a Philadelphia pairing that goes back to the 19th century."],"visit_note":"Closed Mondays, so not available for the Oct 19 free evening; two blocks from The Bellevue for lunch or dinner Tuesday to Saturday (until 9 PM weeknights).","image_query":"Oyster House Philadelphia Sansom Street raw bar","sources":["https://www.jamesbeard.org/stories/james-beard-americas-classics-award-winners-2026","https://phillygrub.blog/2026/02/25/oyster-house-james-beard-classics-award/","https://oysterhousephilly.com/"],"type":"place","body":"Philadelphia's last classic seafood house, run by third-generation owner Sam Mink. The family story starts with Kelly's on Mole Street, a 1901 oyster bar that Samuel Mink bought in 1947; his son David opened Oyster House on Sansom Street in 1976. Executive chef Joe Campoli pairs an old-school raw bar built on revived New Jersey oysters with sherried snapper soup, fried oysters with chicken salad and crab cakes. In February 2026 the James Beard Foundation named it an America's Classic for the Mid-Atlantic. Closed Sunday and Monday.","crumb":"Hotel, dining and venues"},"friday-saturday-sunday":{"id":"friday-saturday-sunday","name":"Friday Saturday Sunday","category":"restaurant","address":"261 S. 21st St., Philadelphia, PA 19103","one_liner":"1973 neighborhood institution turned Michelin star and James Beard Outstanding Restaurant.","why_it_matters":"Proof that a 50-year-old neighborhood restaurant can be repositioned to the top tier without changing address, by new owners who kept the name and rebuilt everything else.","fun_facts":["Jesse Ito, 2026 James Beard Best Chef: Mid-Atlantic winner, calls its New York strip one of the best steaks in the city.","The restaurant is 53 years old; the Williams era is only its last decade."],"visit_note":"Closed Monday and Tuesday, so not available for the Oct 19 free evening; a 12-minute walk from The Bellevue for an independent dinner Wednesday to Sunday.","image_query":"Friday Saturday Sunday restaurant Philadelphia Lovers Bar","sources":["https://guide.michelin.com/en/pennsylvania/philadelphia_2942787/restaurant/friday-saturday-sunday","https://en.wikipedia.org/wiki/Friday_Saturday_Sunday","https://www.inquirer.com/food/james-beard-wins-2026-philadelphia-20260615.html","https://www.fridaysaturdaysunday.com/"],"type":"place","body":"A Rittenhouse institution founded in April 1973 and reinvented after chef Chad Williams and his wife Hanna bought it in 2016. The 53-seat upstairs dining room serves a set multi-course tasting menu; the ground floor is the Lovers Bar, a James Beard finalist for Outstanding Bar in 2025 and 2026. It won the James Beard Award for Outstanding Restaurant in 2023 and, in November 2025, one of Philadelphia's first three Michelin stars; inspectors singled out the sweetbreads, quail and New York strip. Open Wednesday through Sunday; reservations recommended, the bar takes walk-ins.","crumb":"Hotel, dining and venues"},"hershels-east-side-deli":{"id":"hershels-east-side-deli","name":"Hershel's East Side Deli (Reading Terminal Market)","category":"restaurant","address":"Reading Terminal Market, 51 N. 12th St., Philadelphia, PA 19107 (market map B6)","one_liner":"House-cured pastrami in a Katz's-style deli inside the 1893 market.","why_it_matters":"Reading Terminal Market, open since 1893 under the old Reading Railroad train shed, is a working example of a public market sustaining 80-plus small merchants in the middle of a convention district.","fun_facts":["On the first day of the 2018 Flower Show the deli went through nearly 1,500 pounds of meat.","Locals call it the best Jewish deli outside New York."],"visit_note":"Tuesday Oct 20, 12:30 PM lunch stop; expect a 10 to 15 minute line at midday.","image_query":"Hershel's East Side Deli Reading Terminal Market pastrami","sources":["https://whyy.org/articles/hershels-east-side-deli-record-breaking-breakfasts-longtime-traditions","https://readingterminalmarket.org/merchant/hershels-east-side-deli/","https://www.visitphilly.com/things-to-do/food-drink/reading-terminal-market/"],"type":"place","body":"A New York-style Jewish deli on the market's 12th Street side, opened by Steve Safern and chef Andy Wash and named for Safern's uncle Hershel, who cooked at Katz's Delicatessen in Manhattan for more than 40 years. The pastrami and corned beef are cured in-house in the market's basement; on a normal day the counter goes through 300 to 500 pounds of meat. Order the hot pastrami on rye with mustard, or a Reuben, and share; portions are large.","crumb":"Hotel, dining and venues"},"dinics-roast-pork":{"id":"dinics-roast-pork","name":"Tommy DiNic's Roast Pork (Reading Terminal Market)","category":"restaurant","address":"Reading Terminal Market, 51 N. 12th St., Philadelphia, PA 19107","one_liner":"The roast pork sandwich a TV host named the best in America.","why_it_matters":"Four generations of one family in a single market stall: the kind of tenant longevity that gives Reading Terminal Market its draw and its leverage with the Convention Center next door.","fun_facts":["Richman tasted 28 sandwiches across the country before choosing DiNic's in the 2012 finale.","The business is run by the fourth generation of the Nicolosi family."],"visit_note":"Tuesday Oct 20, 12:30 PM lunch stop; this is the longest line in the market, so send one person ahead to order for the group.","image_query":"DiNic's roast pork sandwich broccoli rabe provolone Reading Terminal","sources":["https://www.goldbelly.com/tommy-dinics","https://inquirer.com/philly/blogs/the-insider/DiNics-roast-pork-named.html","https://www.visitphilly.com/things-to-do/food-drink/reading-terminal-market/"],"type":"place","body":"The Nicolosi family's roast pork counter has been in Reading Terminal Market since 1980; the family business dates to Gaetano Nicolosi's 1918 South Philadelphia butcher shop. The sandwich is slow-roasted, Italian-seasoned pork sliced thin and dipped in jus, layered with garlicky broccoli rabe and sharp provolone on a Sarcone's roll. In 2012 Adam Richman named it Best Sandwich in America on the Travel Channel, and the line has not shortened since. Order 'pork, rabe, sharp' and eat it right away.","crumb":"Hotel, dining and venues"},"510-n-broad-lvl-north":{"id":"510-n-broad-lvl-north","name":"510 N. Broad St. (LVL North)","category":"development_site","address":"510 N. Broad St., Philadelphia, PA 19123","one_liner":"Alterra's 410-unit modular building over a Giant supermarket, Philadelphia's largest.","why_it_matters":"The project pairs modular residential floors with a conventional podium and a grocery anchor on a transit corner (Spring Garden station on the Broad Street Line), which is where modular pays off in a union-labor city: repeatable units above, site-built complexity below. Ask about crane logistics on North Broad and how the lenders treated factory deposits in the capital stack.","fun_facts":["The ground-floor Giant opened June 24, 2022 in an area the city had classified as a food desert.","The building sits directly above Spring Garden Station on the Broad Street subway line.","Alterra's earlier modular buildings with VBC include 4125 and 4301 Chestnut Street in University City."],"visit_note":"Tuesday Oct 20, 9:15 AM guided tour with Alterra and VBC; the group then walks east on Spring Garden Street toward 1314 Spring Garden and the Rail Park.","image_query":"LVL North 510 North Broad Street Philadelphia modular apartments","sources":["https://www.multihousingnews.com/alterra-lands-120m-for-philadelphia-mixed-use-project/","https://gbca.com/?p=19556","https://phillyyimby.com/?p=24693","https://vbc.co/projects/","https://billypenn.com/2022/06/26/philadelphia-new-supermarket-giant-north-broad/"],"type":"place","body":"LVL North, at the corner of Broad and Spring Garden Streets, is Alterra Property Group's 410-unit mixed-use building, delivered by stacking factory-built apartment modules on a steel and concrete podium that holds 288 underground parking spaces and 110,000 sq ft of commercial space, including a 50,000 sq ft Giant supermarket that opened June 24, 2022. JKRP Architects designed the 378,000 sq ft, seven-story building; Clemens Construction was general contractor; Volumetric Building Companies (VBC), the Philadelphia-headquartered modular manufacturer, lists it in its portfolio. Alterra financed the roughly $180 million project in 2020 with a $107.5 million Bank OZK senior loan and $12.5 million of Lionheart Strategic Management mezzanine debt. It was Alterra's third modular project and, on completion, the largest modular apartment building in Philadelphia. Construction topped out in December 2021.","crumb":"Sites on the tour","related":["alterra","vbc"],"when":"Tue 9:15 AM"},"1314-spring-garden":{"id":"1314-spring-garden","name":"1314 Spring Garden St. (Spring Garden Apartments)","category":"development_site","address":"1314 Spring Garden St., Philadelphia, PA 19123","one_liner":"VBC's own 149-unit modular building, concept to keys in 16 months.","why_it_matters":"Vertical integration is the lesson: one company carried design, manufacturing, installation and ownership risk, close to the integrated housebuilder model familiar in Japan. The unit mix (studios under 45 sq m) is a bet on affordability through size rather than subsidy, and the 16-month schedule is the number to interrogate.","fun_facts":["VBC bought Katerra's 577,000 sq ft Tracy, California factory out of the 2021 bankruptcy.","VBC merged with Polish steel-module maker Polcom in January 2022 and claims more than 1.25 million sq ft of factory space.","Founder Vaughan Buckley started VBC in 2009 as a general contractor."],"visit_note":"Tuesday Oct 20, a walk-by for photos after 510 N. Broad and before the Rail Park, whose Phase 1 entrance is at Broad and Noble Streets.","image_query":"1314 Spring Garden Street Philadelphia VBC modular apartments","sources":["https://www.woodworksinnovationnetwork.org/projects/spring-garden-apartments","https://www.bdcnetwork.com/building-sector-reports/modular-building/news/55165394/volumetric-building-companies-a-modular-manufacturer-designer-and-contractor-looks-to-expand-its-global-presence","https://vbc.co/projects/"],"type":"place","body":"Spring Garden Apartments is the rare modular project where the manufacturer was also the developer: Volumetric Building Companies designed it (VBC Studio as architect of record), built the modules, acted as general contractor and owns it. The seven-story, 106,318 sq ft building holds 149 market-rate units, deliberately compact: 96 studios of 432 sq ft, 48 junior one-bedrooms of 496 sq ft and five two-bedrooms, over 28 underground parking spaces and 1,598 sq ft of retail. It is Type III-A light-frame construction, five modular floors over a two-story podium, completed in 2024 after a 16-month construction schedule, all-electric, with VBC reporting roughly 50 percent less construction waste than a comparable site-built project. Lochsa was the structural engineer.","crumb":"Sites on the tour","related":["vbc"],"when":"Tue 10:35 AM"},"17-market-west":{"id":"17-market-west","name":"17 Market West (1701 Market St.)","category":"development_site","address":"1701 Market St., Philadelphia, PA 19103","one_liner":"Philadelphia's largest post-pandemic office-to-residential conversion: 299 apartments.","why_it_matters":"The economics are the lesson: a single-tenant building vacated in one move, a modest floorplate that needed no light wells, reusable HVAC and elevators, by-right zoning with no ZBA review, and a purchase price near land value. Alterra says the conversion took about a year less than new construction. Philadelphia's 10-year property-tax abatement remains in force for conversions, while abatements on new residential construction have been phased down since 2022.","fun_facts":["The building sold for roughly half its assessed value.","Residents can walk underground to Suburban Station without going outside.","Alterra's Mark Cartella on the conversion market: 'The low-hanging fruit has now all been picked.'"],"visit_note":"Tuesday Oct 20, 2:00 PM site visit with Alterra; from Reading Terminal Market it is a 15-minute walk west along Market Street.","image_query":"17 Market West 1701 Market Street Philadelphia conversion","sources":["https://inquirer.com/real-estate/1701-market-office-to-residential-conversion-alterra-property-group-20250203.html","https://www.bisnow.com/news/philadelphia/multifamily/alterra-office-to-residential-1701-market-apartments-center-city-128500","https://www.phillyvoice.com/center-city-apartments-office-to-residential-philly-alterra-1701-market/","https://norr.com/project/17-market-west"],"type":"place","body":"17 Market West is Alterra Property Group's conversion of 1701 Market Street, an 18-story, 305,000 sq ft office tower built in 1957 and gut-renovated in the late 1990s, which was the headquarters of law firm Morgan Lewis until the firm moved out. Alterra bought it in October 2023 for $26.2 million, about $75 per sq ft and more than 40 percent below the city's assessment, and started construction in January 2024 with Clemens Construction, Bala Consulting Engineers and architect NORR. Floors 6 to 18 hold 299 one- and two-bedroom units, about 70 percent one-bedroom; floors 2 to 5, converted to parking years earlier, hold 190 spaces. NORR cut the limestone spandrels to make taller windows. First residents moved in May 2025 with one-bedrooms from about $2,350. Amenities include a rooftop saltwater pool heated by the building's former steam system and a direct underground link to Suburban Station.","crumb":"Sites on the tour","related":["alterra"],"when":"Tue 2:00 PM"},"lotus-residences":{"id":"lotus-residences","name":"Lotus Residences & Wellness Club","category":"development_site","address":"416 Vine St., Philadelphia, PA 19106","one_liner":"A 75-unit Old City rental built around a members' wellness club.","why_it_matters":"A small-site test of the amenity-as-membership model: wellness programming sold to residents and to outside members, which both differentiates an awkward highway-adjacent lot and adds a second revenue line. Ask how a staffed club pencils at 75 units, and how it compares with well-being residential concepts now marketed in Tokyo.","fun_facts":["Volpe sketched the original concept, a circular building with a communal center, on a napkin.","The lounge is open to the public 8 AM to 8 PM daily.","Studios with Ori lifting beds rent for about $300 a month more than standard studios."],"visit_note":"Wednesday Oct 21, 10:30 AM tour; a 10-minute taxi from The Bellevue, then a 15-minute walk south to Christ Church Neighborhood House for lunch.","image_query":"Lotus apartments 416 Vine Street Old City Philadelphia","sources":["https://www.phillymag.com/be-well-philly/2025/01/21/lotus-wellness-apartments/","https://jackphillyre.substack.com/p/lotus-lofts-signals-change-for-pocket","https://phillyyimby.com/?p=42049","https://www.ocfrealty.com/naked-philly/old-city/demo-clears-way-for-nature-focused-lotus-lofts-in-old-city/"],"type":"place","body":"Lotus is a six-story, roughly 75-unit rental building in the northern pocket of Old City, developed by Lily Development around founder Ali Volpe's idea of wellness living: a residence wrapped around a members' club. Ambit Architecture designed it on the former Macmillan poultry site near the Ben Franklin Bridge ramps, with 13 parking spaces and ground-floor commercial space. The two-level Lotus Wellness Spa and Lounge has a fitness studio for yoga, Pilates and barre, a recovery spa with hot tub, cold plunge and infrared sauna, a meditation room with a sound bed, and a juice bar that becomes a zero-proof bar at night; the roof has an edible garden, fire pits and a teaching kitchen. Some studios use Ori robotic furniture that lifts the bed to the ceiling. Leasing began in spring 2025 with studios from about $1,650, and a limited number of non-resident memberships are sold.","crumb":"Sites on the tour","related":["lily-development"],"when":"Wed 10:30 AM"},"amy-gutmann-hall":{"id":"amy-gutmann-hall","name":"Amy Gutmann Hall, University of Pennsylvania","category":"campus_building","address":"3333 Chestnut St. (northeast corner of 34th and Chestnut), Philadelphia, PA 19104","one_liner":"Six-story mass timber home of Penn's data science and AI programs.","why_it_matters":"A six-story Type III-A mass timber building on a narrow infill lot is the realistic code path for timber in a US city today: timber where the structure is repetitive, steel where spans are long, acoustic underlayment to handle the lightweight floors, and installation by union carpenters. It is a useful comparison for Japan's own CLT promotion efforts.","fun_facts":["It is widely described as Philadelphia's first mass timber building, and Penn states it is the region's tallest.","Mass timber was installed by Denk & Roche Builders with United Brotherhood of Carpenters labor.","A roughly 60-foot artwork, 'Cascode' by Eto Otitigbe, hangs on the adjacent parking garage."],"visit_note":"Thursday Oct 22, 10:00 AM guided tour; it is a working academic building, so the group should keep voices low on the research floors.","image_query":"Amy Gutmann Hall Penn mass timber interior","sources":["https://penntoday.upenn.edu/news/dedication-penn-amy-gutmann-hall-celebrated","https://www.woodworks.org/award-gallery/amy-gutmann-hall-data-science-ai-building/","https://technical.ly/civic-news/university-of-pennsylvania-new-building/","https://www.engineering.upenn.edu/stories/topping-off-amy-gutmann-hall/"],"type":"place","body":"Penn Engineering's center for data science and AI, dedicated in September 2024 and opened for classes in January 2025, is a six-story, 116,000 sq ft mass timber building designed by Lake|Flato with KSS Architects, engineered by Buro Happold and built by Gilbane for about $137.5 million, with a $25 million gift from trustee Harlan Stone. The structure is cross-laminated timber floor panels on glulam beams and columns, with exposed timber braced frames as part of the lateral system and steel used only for the long-span auditorium, some exterior columns and stairs. Eighty-two truckloads of timber were delivered. Penn calls it the region's tallest mass timber structure, and the architects cite embodied carbon 52 percent lower than concrete and 41 percent lower than steel. It won a 2026 WoodWorks Wood in Architecture award. A 12,000 sq ft green roof and a 200-seat auditorium complete the program.","crumb":"Sites on the tour","related":["kss-architects","rothoblaas"],"when":"Thu 10:00 AM"},"schuylkill-yards":{"id":"schuylkill-yards","name":"Schuylkill Yards","category":"development_site","address":"3001 to 3151 Market St. and JFK Blvd., beside 30th Street Station, Philadelphia, PA 19104","one_liner":"Brandywine and Drexel's 14-acre, $3.5 billion district beside 30th Street Station.","why_it_matters":"A ground lease from a university, a public park built first to set value, and a mid-stream pivot from office to life science and partly back again: Schuylkill Yards is an honest case study in phasing risk. The C-PACE financing on 3151 Market shows how US owners are using energy-efficiency loans to carry empty lab space through a soft market.","fun_facts":["Drexel owns the land and leases it to Brandywine; the ground rent feeds Drexel's endowment, and Drexel may take up to 10 percent of any building at favorable rates.","Goodwin Procter took a 12.5-year lease for the eighth floor of 3025 JFK, reversing the building's planned life-science use.","3151 Market's first tenants were a state wine and spirits store and a Starbucks at street level."],"visit_note":"Thursday Oct 22, 11:00 AM walking tour with Brandywine, starting at Drexel Square and ending at the Cira Centre.","image_query":"Schuylkill Yards Drexel Square 3025 JFK Boulevard Philadelphia","sources":["https://billypenn.com/2023/10/25/schuylkill-yards-philadelphia-drexel-brandywine-realty-trust-development/","https://www.bisnow.com/news/philadelphia/life-sciences/pennsylvania-largest-c-pace-loan-brandywine-3151-market-nuveen-132932","https://www.bisnow.com/news/philadelphia/office/brandywine-realty-trust-first-office-tenant-schuylkill-yards-tenant-goodwin-procter-120587","https://blog.brandywinerealty.com/en/brandywine-announces-joint-venture-global-institutional-investor-3025-jfk-blvd","https://www.brandywinerealty.com/schuylkill-yards"],"type":"place","body":"Schuylkill Yards is Brandywine Realty Trust's 14-acre, $3.5 billion master plan on land owned by Drexel University beside Amtrak's 30th Street Station, planned over decades as 3.9 million sq ft of office, life science and innovation space, 1.5 million sq ft of residential, 65,000 sq ft of retail and 6.5 acres of open space. Completed so far: Drexel Square, a 1.3-acre park built first; the Bulletin Building, the former newspaper headquarters converted for Spark Therapeutics; 3025 JFK Boulevard, the 28-story West Tower finished in 2023 with 326 Avira apartments, 200,000 sq ft of office and lab space and law firm Goodwin Procter as anchor, financed with an unnamed 'global institutional investor'; and 3151 Market, a 12-story, 495,000 sq ft lab-and-office building completed in 2024, about 4 percent leased in January 2026 and refinanced with an $87.3 million C-PACE loan, the largest in Pennsylvania. The 800,000 sq ft 3001 JFK tower waits for 50 percent pre-leasing.","crumb":"Sites on the tour","related":["brandywine"],"when":"Thu 11:00 AM"},"cira-centre":{"id":"cira-centre","name":"Cira Centre","category":"development_site","address":"2929 Arch St., Philadelphia, PA 19104","one_liner":"Cesar Pelli's 2005 glass tower built over the rails at 30th Street Station.","why_it_matters":"Air-rights development over active rail plus a 15-year tax-free zone made a Class A tower pencil in a then-marginal location, the template that Schuylkill Yards extends north along the river.","fun_facts":["In April 2014 Drexel's Frank Lee turned both faces of the tower into a Guinness-record Tetris game across about 119,600 sq ft of LEDs.","The LEDs show an Eagles logo or a Phillies 'P' on game days."],"visit_note":"Thursday Oct 22, the Schuylkill Yards tour ends here around 11:45 AM, ahead of lunch with the Wharton clubs.","image_query":"Cira Centre Philadelphia 30th Street Station night LED","sources":["https://en.wikipedia.org/wiki/Cira_Centre","https://drexel.edu/news/archive/2014/june/cira-tetris-guinness"],"type":"place","body":"Brandywine's 29-story, 437-foot office tower, designed by Cesar Pelli and opened in October 2005 on a platform over Amtrak's tracks across Arch Street from 30th Street Station, with a pedestrian bridge into the station. Its faceted glass skin hides a wall of RGB LEDs that display patterns at night. The project pioneered the Keystone Opportunity Zone model here, exempting tenants from most state and local taxes for 15 years until the designation expired at the end of 2018; Brandywine later added the Evo student tower (2014) and FMC Tower (2016) at Cira Centre South with Penn.","crumb":"Sites on the tour","related":["brandywine"],"when":"Thu 11:45 AM"},"tangen-hall-venture-lab":{"id":"tangen-hall-venture-lab","name":"Tangen Hall / Penn Venture Lab","category":"campus_building","address":"115 S. 40th St. (40th and Sansom), Philadelphia, PA 19104","one_liner":"Penn's seven-story startup hub, home of Venture Lab and the Startup Challenge.","why_it_matters":"This is Great Wave's deal-flow neighborhood: a university that pulled all of its student venture programs under one roof, with robotics and hardware teams regularly among the finalists. For LPs it is a look at the US campus pipeline that produces construction-tech and robotics founders.","fun_facts":["The food innovation lab was the first of its kind on Penn's campus.","The building was sited along 40th Street on purpose, next to undergraduate housing.","The Startup Challenge draws about 30 semifinalists a year, narrowed to eight finalists."],"visit_note":"Thursday Oct 22, 1:00 PM visit, the final stop of the summit; the program concludes at 1:45 PM.","image_query":"Tangen Hall Penn 40th and Sansom exterior","sources":["https://facilities.upenn.edu/maps/locations/tangen-hall","https://penntoday.upenn.edu/news/new-campus-buildings-house-centers-innovation-and-collaboration","https://news.wharton.upenn.edu/?p=12443","https://venturelab.upenn.edu/sync-labs-wins-50-000-perelman-grand-prize-at-2025-venture-lab-startup-challenge"],"type":"place","body":"Tangen Hall is Penn's seven-story, 68,000 sq ft entrepreneurship building, designed by KSS Architects and completed in December 2020, funded by a $25 million gift from the AKO Foundation of Nicolai Tangen, a 1992 Wharton alumnus and founder of AKO Capital. It houses Venture Lab, a partnership of Wharton, Penn Engineering and the Weitzman School of Design that runs the Startup Challenge, the Venture Initiation Program and the VIP-X accelerator, plus a food innovation lab and test kitchen, fabrication and digital studios, a retail lab storefront for student products and a founders' suite for student companies. Penn calls it the largest hub of its kind on any campus. The 2025 Startup Challenge gave its $50,000 Perlman Grand Prize to Sync Labs, an AI monitoring system for senior-living facilities; finalists included Serpent Robotics and KAL Robotics, and the finals offered more than $150,000 in prizes.","crumb":"Sites on the tour","when":"Thu 1:00 PM"},"feast-your-eyes-catering":{"id":"feast-your-eyes-catering","name":"Feast Your Eyes Catering","category":"caterer","address":"1750 N. Front St., Philadelphia, PA 19122","one_liner":"Philadelphia caterer since 1982, run from a converted barrel factory.","why_it_matters":"A long-tenured local caterer with its own sustainability practices was chosen for the Stotesbury Mansion dinner; expect seasonal Mid-Atlantic menus built on local produce.","fun_facts":["Front & Palmer was named one of America's top 45 wedding venues by Brides.com.","The company has sourced local produce for more than 20 years."],"visit_note":"Caters the Wednesday Oct 21, 5:30 PM closing dinner at Stotesbury Mansion.","image_query":"Feast Your Eyes Catering Philadelphia Front and Palmer","sources":["https://old.lasalle.edu/magazine/?p=180","https://www.feastyoureyescatering.com/","https://theknot.com/marketplace/feast-your-eyes-catering-philadelphia-pa-2036355"],"type":"place","body":"Feast Your Eyes has catered in Philadelphia since 1982. Founder Lynn Buono runs it with her husband Skip Schwarzman from a former 1800s barrel factory in South Kensington that doubles as their event venue, Front & Palmer (since 2009). The company handles everything from six-person dinners to 10,000-guest events, including university trustee dinners, and was composting, sourcing locally and keeping rooftop beehives before sustainability became a selling point. It is known for themed, theatrical events as much as for the food.","crumb":"Hotel, dining and venues"},"raise-robotics":{"id":"raise-robotics","name":"Raise Robotics","category":"startup","hq":"San Francisco, CA (union training partnership based in Philadelphia)","founded":"2021","website":"https://www.raiserobotics.com","one_liner":"Jobsite robots that lay out, drill and fasten facade brackets at the slab edge.","why_it_matters":"Japanese general contractors face the same shortage of skilled facade crews and the same fall-protection pressure as US builders. A robot that does slab-edge layout and anchor drilling from inside the handrail fits high-rise curtain wall work in Tokyo and Osaka, and the union training model shows how organized labor can adopt robots rather than resist them.","fun_facts":["The robot mounts on standard Genie scissor and boom lifts, so it rides equipment contractors already rent.","About two dozen IUPAT glazier trainers were certified on the robot in Philadelphia in July 2025.","On the St. Jude project the robot saved an estimated 830 labor hours and beat the manual budget."],"presenting_slot":"Wednesday, October 21, 1:40 PM: startup presentations, Christ Church Neighborhood House","logo_query":"Raise Robotics construction robotics logo","sources":["https://www.enr.com/articles/61108-raise-robotics-nets-775m-in-seed-funding-to-build-out-multipurpose-robot-platform","https://usg.mydigitalpublication.com/articles/three-days-one-big-step","https://www.therobotreport.com/raise-robotics-discuss-scaling-field-robots-robobusiness/","https://impactalpha.com/raise-robotics-raises-7-8-million-to-help-construction-companies-with-workplace-safety-and-labor-shortages/"],"type":"company","body":"Raise Robotics builds a mobile robotic platform for the most dangerous work at the edge of a floor slab: laser layout from digital drawings, hammer-drilling anchor holes, and installing the brackets that carry curtain wall and facade panels. The company was founded in 2021 by Gary Chen (CEO, formerly at Waymo) and Conley Oster (COO, a former crane and rigging project manager). In July 2025 it closed a $7.75 million seed round led by MaC Venture Capital with Undivided Ventures, Cybernetix Ventures, Zacua Ventures and Union Labs. On the St. Jude Children's Research Hospital tower in Memphis the robot laid out more than 10,000 curtain wall panels to within 1/16 inch. By September 2026 it reported 10 commercial projects across eight states. Its union operator certification launched at IUPAT District Council 21 in Philadelphia in July 2025.","crumb":"Companies","flag":"To confirm: Raise is San Francisco based (CEO Gary Chen); its Philadelphia tie is the IUPAT glaziers training. No public record of a Navy Yard demo or Iron Workers partnership.","people":["conley-oster"],"when":"Wed 1:40 PM"},"guthrie-ai":{"id":"guthrie-ai","name":"Guthrie AI","category":"startup","hq":"Philadelphia, PA","founded":null,"website":"https://www.guthrieai.com","one_liner":"AI-enabled virtual bid assistants that let trade contractors bid more work.","why_it_matters":"Estimating is a bottleneck for Japanese subcontractors as experienced estimators retire. Guthrie's hybrid model, software plus trained remote staff rather than full automation, is a pragmatic template for takeoff and bid work in Japan, where drawings are still often read by hand, and a 70 percent lift in bid capacity changes which jobs a firm can chase.","fun_facts":["The founder grew up doing takeoffs in his family's glass business before joining the Marines.","Guthrie says AI handles bid text well but still cannot reliably read where window frames sit on drawings, so people do that part.","About 10 percent of the bid process is automated today; the company's goal is to raise that share steadily."],"presenting_slot":"Wednesday, October 21, 1:55 PM: startup presentations, Christ Church Neighborhood House","logo_query":"Guthrie AI construction bidding logo","sources":["https://www.bisnow.com/news/philadelphia/construction-development/guthrie-ai-seed-round-ai-construction-bids-135510","https://www.mychesco.com/a/news/regional/guthrie-ai-raises-4-million-to-expand-construction-platform/","https://www.techcompanynews.com/guthrie-ai-raises-4m-in-seed-funding-round/","https://pulse2.com/guthrie-ai-raises-4-million-seed-funding-to-scale-virtual-bid-assistant-platform-for-glazing-contractors/"],"type":"company","body":"Guthrie AI helps specialty contractors, starting with glass and glazing firms, prepare and submit more bids. Each client gets a dedicated Virtual Bid Assistant, a trained person supported by Guthrie's software, which reads bid invitations, identifies scope, organizes drawings and moves data between Bluebeam, Outlook and Excel. Founder and President Ted Baumgardner, a former Marine intelligence officer and glazing estimator with an MBA from the University of Pennsylvania, began building the platform in 2024 after two years of pilots; Tuneer De is co-founder and Head of Product. The company grew on its own cash flow until July 2026, when it closed a $4 million seed round led by Chicago Ventures with York IE, MVP Capital Partners and Flybridge. It reports 52 contractor clients in more than 40 states and about 70 percent more bids per estimator.","crumb":"Companies","flag":"To confirm: press reports give the founding year as both 2023 and 2024; omitted until confirmed.","people":["ted-baumgardner"],"when":"Wed 1:55 PM"},"serpent-robotics":{"id":"serpent-robotics","name":"Serpent Robotics","category":"university_program","hq":"Philadelphia, PA (Pennovation Works and Tangen Hall, University of Pennsylvania)","founded":"2024","website":"https://www.serpentrobotics.com","one_liner":"Rope-climbing robot that cuts tree branches while the arborist stays on the ground.","why_it_matters":"Japan's utilities, railways and forestry operators face aging crews and chronic injuries from tree work near power lines and rail corridors. A low-cost climbing robot that keeps the worker on the ground addresses the same labor and safety gap, and the Penn pipeline (lab technology, student team, university prizes) is a model for corporate venture scouting.","fun_facts":["The operator controls the robot with a handheld remote and camera feed the team compares to a Nintendo controller.","Trees are the leading cause of electrical outages in the United States, which is why utilities are a target market.","The team took design input from arborists at Harvard's Arnold Arboretum and Penn's Morris Arboretum."],"presenting_slot":"Wednesday, October 21, 2:10 PM: startup presentations, Christ Church Neighborhood House","logo_query":"Serpent Robotics Penn tree care robot logo","sources":["https://penntoday.upenn.edu/news/presidents-innovation-prize-margaret-zhu-serpent-robotics","https://www.engineering.upenn.edu/stories/class-of-2026-presidents-engagement-and-innovation-prize-winners-announced/","https://pennovation.upenn.edu/news/eighth-annual-pennovation-accelerator-pitch-day-event-recap","https://poetsandquantsforundergrads.com/students/2025-most-disruptive-business-school-startups-serpent-robotics-wharton-school/"],"type":"company","body":"Serpent Robotics is building a rope-climbing, remote-controlled robot for tree care, one of America's most dangerous trades. A worker tosses a rope into the tree and clips on the two-foot robot; a motorized ascender carries it up, two claws clamp a branch, blades make the cut, and the robot can hold the limb on the way down. The core technology came from the lab of Penn mechanical engineering professor Mark Yim. The team formed in fall 2024 around Penn's Y-Prize competition: Wharton finance student Margaret Zhu with Integrated Product Design master's students Steyn Knollema, Jason Li and Yiran Xuan. It won the 2025 Venture Lab Startup Challenge ($20,000), the 2025 Pennovation Accelerator overall prize, and in 2026 the Penn President's Innovation Prize ($100,000 plus living stipends). Pilots are planned with four tree care companies in Pennsylvania and Seattle.","crumb":"Companies","people":["margaret-zhu"],"when":"Wed 2:10 PM"},"burro":{"id":"burro","name":"Burro (Burro.AI, formerly Augean Robotics)","category":"startup","hq":"Philadelphia, PA (Callowhill, 421 N 7th St) with an office in Visalia, CA","founded":"2017","website":"https://burro.ai","one_liner":"Autonomous carts that follow crews and haul materials, proven on farms.","why_it_matters":"Material handling is the most repetitive labor on any Japanese jobsite or farm, and Burro's robots already run outdoors without fixed infrastructure. For a general contractor the question is whether a follow-me cart proven in orchards can move drywall, fasteners and tools across a site. Toyota Ventures is already an investor.","fun_facts":["Burro says an eight-person harvest crew with one robot picks 15 to 30 percent more fruit per day.","The company operated as Augean Robotics before rebranding as Burro around 2021.","Robots are sold through farm equipment dealers rather than direct, a channel Burro plans to use abroad."],"presenting_slot":"Wednesday, October 21, 2:25 PM: startup presentations, Christ Church Neighborhood House","logo_query":"Burro.AI autonomous farm robot logo","sources":["https://technical.ly/startups/robotics-philadelphia-burro-series-b-raise","https://burro.ai/about/","https://technical.ly/startups/burro-robots-agriculture-autonomous-vehicles-founding-philly","https://foundingphilly.buzzsprout.com/2017333/episodes/15122128-burro-ceo-co-founder-charlie-andersen-founding-philly-ep-41"],"type":"company","body":"Burro, founded in Philadelphia in 2017 as Augean Robotics, makes collaborative autonomous ground robots that follow people or drive fixed routes carrying loads so crews do less hauling. Hundreds of units work in nurseries, vineyards and berry farms, sold through dealers, and the company is extending into depot yards, industrial transport and vegetation management, with construction sites named as a coming market. Burro closed a $24 million Series B in January 2024 led by Catalyst Investors and Translink Capital, with S2G Ventures, Toyota Ventures, F-Prime Capital and Cibus Capital, following an $11 million Series A in 2021, and it joined John Deere's agtech accelerator. About 50 people work from Callowhill and Visalia, California. CEO Charlie Andersen grew up in a family farm and construction business.","crumb":"Companies","people":["charlie-andersen"],"when":"Wed 2:25 PM"},"rothoblaas":{"id":"rothoblaas","name":"Rothoblaas (Rotho Blaas USA Inc.)","category":"manufacturer","hq":"Cortaccia (Kurtatsch), South Tyrol, Italy; US subsidiary in New York, NY","founded":"1991","website":"https://www.rothoblaas.com","one_liner":"Italian maker of screws, connectors, membranes and fall protection for timber buildings.","why_it_matters":"Japanese policy now encourages wood in mid-rise public and commercial buildings, creating exactly the market Rothoblaas serves in Europe: standardized connectors with published test data, acoustic layers for CLT floors and fall protection for timber erection crews. For Japanese developers and contractors evaluating CLT or hybrid structures, the supplier ecosystem matters as much as the panel maker.","fun_facts":["The headquarters sits in a wine village, Cortaccia sulla Strada del Vino, in the Italian Alps.","Rothoblaas started as an importer of German woodworking machinery and dropped that business in 1996 to focus on fasteners.","Revenue at the Italian parent nearly doubled between 2020 and 2022 as cross-laminated timber demand grew."],"presenting_slot":"Wednesday, October 21, 3:00 PM: Innovative real estate session, Christ Church Neighborhood House; also joins the Amy Gutmann Hall tour Thursday 10:00 AM","logo_query":"Rothoblaas logo timber","sources":["https://www.rothoblaas.com/company-rothoblaas","https://www.aziende.it/rotho-blaas-srl","https://www.wirtschaftsforum.de/interviews/rotho-blaas-deutschland-gmbh/alpines-herz-globaler-geist/","https://tfguild.org/events/2023-annual-conference/tab/speakers/24"],"type":"company","body":"Rothoblaas develops and distributes the hardware that makes mass timber buildable: structural screws, steel connectors and hold-downs, airtightness and waterproofing membranes, acoustic isolation layers, fire protection and fall-arrest systems. Founded in 1991 by Robert Blaas in Cortaccia, South Tyrol, it began as a trader of German woodworking machines, started producing timber screws in 2003 and now sells in more than 70 countries through subsidiaries, with an in-house engineering department that publishes test data for designers. The Italian parent reported revenue of about EUR 116 million in 2022 with roughly 335 employees, up from EUR 66 million in 2020. Rotho Blaas USA Inc., based in New York under CEO Hannes Blaas, serves the US mass timber market from a US warehouse and runs technical training on CLT connections, acoustics and envelope detailing for architects and contractors.","crumb":"Companies","related":["amy-gutmann-hall"],"people":["hannes-blaas"],"when":"Wed 3:00 PM"},"gateway-south":{"id":"gateway-south","name":"Gateway South (Good Developments Group)","category":"developer","hq":"St. Louis, MO","founded":"2021 (Good Developments Group)","website":"https://gatewaysouthstl.com","one_liner":"A 100-acre construction innovation district on the St. Louis riverfront.","why_it_matters":"Gateway South is a bet that a city can win construction manufacturing the way St. Louis's Cortex district won biotech: cluster factories, training and R&D on cheap industrial land with multimodal logistics. For Japanese developers it is a template for innovation districts and a possible landing spot for modular and robotics ventures that need US factory space.","fun_facts":["The site is Chouteau's Landing, a historic industrial riverfront with Union Pacific rail and Mississippi barge access.","Early announced partners included Assembly OSM, a New York offsite builder.","Greg Gleicher's former firm, JDS Development, built Brooklyn Tower and Manhattan's American Copper Buildings."],"presenting_slot":"Wednesday, October 21, 3:15 PM: Innovative real estate session, Christ Church Neighborhood House","logo_query":"Gateway South St. Louis Good Developments Group logo","sources":["https://gatewaysouthstl.com","https://www.firstalert4.com/2026/02/03/first-alert-forward-gateway-south-development-moves-ahead-despite-setbacks-after-november-fire/","https://www.laduenews.com/business/gateway-south-plans-to-transform-the-st-louis-riverfront/article_6d23c3ac-e1e7-4596-ac44-5b048ce067ab.html","https://www.stlmag.com/business/greg-gleicher-good-developments-group"],"type":"company","body":"Gateway South is a roughly 100-acre, $1.2 billion master-planned district on the Mississippi riverfront just south of the Gateway Arch, led by Good Developments Group (founder and CEO Greg Gleicher) with industrial developer Vault Partners and co-investor Millstone Capital Advisors. Branded the Advanced Building Collaboration District, the plan groups an Innovation Core of workspace for architects, engineers and construction technology firms, a Cultural Core with childcare and workforce training, and a Manufacturing Core of build-to-suit factories for offsite builders, component suppliers and fabricators. Phase 1 is underway: rehabilitation of historic buildings, a childcare center, a training center, a building for an electrical contractor and design of the first new industrial facility, with first completions targeted by the end of 2027. A November 2025 fire damaged part of the site; the developers say the project is proceeding.","crumb":"Companies","flag":"To confirm: identified from public sources as Good Developments Group's St. Louis district. Confirm this is the Wednesday presenter.","people":["greg-gleicher"],"when":"Wed 3:15 PM"},"vbc":{"id":"vbc","name":"Volumetric Building Companies (VBC)","category":"manufacturer","hq":"Philadelphia, PA","founded":"2009","website":"https://vbc.co","one_liner":"Vertically integrated modular builder with factories in Pennsylvania, California and Poland.","why_it_matters":"VBC is the clearest US example of a modular builder that owns design, factory, logistics and site assembly, the integration Japanese prefab housing companies perfected for single-family homes but have not fully applied to mid-rise multifamily. Its Katerra lesson (buy distressed capacity rather than build it) and its Poland-to-US steel modules are directly relevant to Haseko, Toda or Kumagai Gumi.","fun_facts":["Katerra spent about $110 million building the Tracy plant; VBC bought it for roughly $21 million and says it was profitable within two years.","The Tracy line can produce a wall every five to seven minutes with as few as three operators.","Veterans Village in Frankford houses formerly homeless veterans and cost about a third of a typical budget, per VBC."],"presenting_slot":"Wednesday, October 21, 3:30 PM: closing keynote, Christ Church Neighborhood House","logo_query":"Volumetric Building Companies VBC logo","sources":["https://www.bdcnetwork.com/home/news/55165394/volumetric-building-companies-a-modular-manufacturer-designer-and-contractor-looks-to-expand-its-global-presence","https://www.connectcre.com/stories/volumetric-building-companies-nears-completion-of-seven-story-development/","https://nextcity.org/urbanist-news/can-philly-mass-produce-its-way-out-of-a-housing-crisis","https://vbc.co"],"type":"company","body":"Volumetric Building Companies designs, manufactures and installs volumetric modular buildings, mainly multifamily, student housing and hotels, sometimes as developer. Founded by CEO Vaughan Buckley in 2009 in Philadelphia, VBC bought the former Katerra factory in Tracy, California (577,000 square feet) out of bankruptcy in August 2021, merged with Polish steel-module maker Polcom in 2022 and acquired a 356,000 square foot plant in Berwick, Pennsylvania later that year. It also runs a design center in Monaghan, Ireland. The company says it has manufactured 6,500 units and that 90 percent of clients are repeat customers; Alterra Property Group has used VBC on its last six developments. Philadelphia projects include the 149-unit Astir Callowhill at 1314 Spring Garden Street (its largest self-developed project, nearing completion in September 2025) and the 47-unit Veterans Village, built in 14 months for about $6 million.","crumb":"Companies","related":["510-n-broad-lvl-north","1314-spring-garden"],"people":["vaughan-buckley"],"when":"Wed 3:30 PM"},"alterra":{"id":"alterra","name":"Alterra Property Group","category":"developer","hq":"Philadelphia, PA","founded":"2005","website":"https://www.alterraproperty.com","one_liner":"Philadelphia developer behind office-to-residential conversions and a national industrial outdoor storage platform.","why_it_matters":"Alterra is doing, at scale, the two things Japanese urban developers ask about most in Philadelphia: converting obsolete office floorplates into housing without a full gut rebuild, and using modular construction for mid-rise multifamily. Its IOS fund also shows how a regional developer built a $2 billion-plus national niche platform that institutional and foreign capital can enter.","fun_facts":["The 17 Market West conversion needed no zoning hearing because Center City's office core zoning already allows residential.","Alterra's offices sit above a clothing store in a Walnut Street building the firm redeveloped.","LVL North replaced a block-long parking lot at Broad and Spring Garden."],"presenting_slot":"Tuesday, October 20, 9:15 AM: hosts the 510 N. Broad, Wanamaker Building and 17 Market West tours","logo_query":"Alterra Property Group Philadelphia logo","sources":["https://www.inquirer.com/real-estate/1701-market-office-to-residential-conversion-alterra-property-group-20250203.html","https://www.bisnow.com/news/philadelphia/adaptive-reuse/wanamaker-building-conversion-tf-cornerstone-alterra-129758","https://www.multihousingnews.com/post/alterra-lands-120m-for-philadelphia-mixed-use-project/","https://www.alterraproperty.com/"],"type":"company","body":"Alterra Property Group is a Philadelphia real estate investment, development and management company co-founded by managing partner Leo Addimando and active since 2005. Its residential arm, APG Living, has delivered more than 4,000 new units; its APG IOS platform has acquired more than 400 industrial outdoor storage properties across 38 states. It is a leading modular developer: it built the 410-unit LVL North at 510 North Broad Street (modular, with a GIANT supermarket below) and has used VBC modules on its last six projects. In 2024 it began converting the 18-story former Morgan Lewis headquarters at 1701 Market Street into 17 Market West, 299 apartments, which opened for leasing in 2025. With TF Cornerstone it plans roughly 600 loft-style apartments in the 1.4 million square foot Wanamaker Building, with construction expected to start in 2026.","crumb":"Companies","related":["510-n-broad-lvl-north","wanamaker-building","17-market-west"],"people":["leo-addimando"],"when":"Tue 9:15 AM"},"lily-development":{"id":"lily-development","name":"Lily Development / Lotus Living","category":"developer","hq":"Philadelphia, PA (Old City)","founded":null,"website":"https://www.lotus.living","one_liner":"Wellness-branded apartments in Old City, designed by a therapist turned developer.","why_it_matters":"Japanese residential developers are experimenting with wellness and community branding to differentiate rental product; Lotus is a small, built example of amenity-led positioning (spa, club, programming) in a historic district, with premium pricing for studios that use robotic furniture. Ori's space-saving systems and the public-facing club membership both translate directly to compact Tokyo units.","fun_facts":["Ori studios rent for about $300 more per month than standard studios; Ori says the moving bed adds 20 to 40 percent usable floor space.","The site was the longtime home of the Macmillan poultry company.","The building was first announced as The McMillan Building before being renamed Lotus Lofts."],"presenting_slot":"Wednesday, October 21, 10:30 AM: Lotus Residences tour","logo_query":"Lotus Living Philadelphia 416 Vine logo","sources":["https://www.phillymag.com/be-well-philly/2025/01/21/lotus-wellness-apartments/","https://www.ocfrealty.com/naked-philly/old-city/demo-clears-way-for-nature-focused-lotus-lofts-in-old-city/","https://jackphillyre.substack.com/p/lotus-lofts-signals-change-for-pocket","https://www.lotus.living/"],"type":"company","body":"Lotus is a 74-unit, six-story wellness-focused apartment building and members' club at 416 Vine Street in Old City. Developed by Lily Development with Flow Development and designed by Ambit Architecture, it replaced a former poultry company building after Historical Commission review and opened in May 2025. Founder Ali (Alexandra) Volpe, a former school counselor who moved into real estate development, built the project around biophilic design and programming for body and mind: a two-level spa with hot tub, cold plunge, infrared sauna and salt room, a fitness studio run with Alchemy X, a meditation room and a rooftop with an edible garden and fire pits. Some studios use Ori robotic furniture, in which the bed rises to the ceiling. A limited Wellness Club membership opens the amenities to non-residents, and additional Lotus locations in Philadelphia are planned.","crumb":"Companies","related":["lotus-residences"],"people":["ali-volpe"],"when":"Wed 10:30 AM"},"brandywine":{"id":"brandywine","name":"Brandywine Realty Trust","category":"reit","hq":"Philadelphia, PA","founded":"1994","website":"https://www.brandywinerealty.com","one_liner":"Philadelphia's largest office REIT and master developer of Schuylkill Yards.","why_it_matters":"Schuylkill Yards is the kind of transit-anchored, university-partnered district Japanese developers build around Tokyo and Osaka stations, executed by a public REIT that is now seeking capital partners after buying out its JV investors. For Mitsubishi Estate, Mori Trust or Hankyu Hanshin it is a live case in office-to-lab-to-office pivots and in US REIT capital structure.","fun_facts":["Jerry Sweeney started Brandywine in 1994 with one assistant and four small buildings; he also co-owns Bonomo Turkish Taffy.","Cira Green, a one-acre park on top of the FMC Tower parking garage, won an AIA Honor Award in 2015.","The 3151 Market buyout was mostly funded with a $50 million C-PACE loan, a green-building financing tool."],"presenting_slot":"Thursday, October 22, 11:00 AM: Schuylkill Yards tour, ending at Cira Centre","logo_query":"Brandywine Realty Trust logo","sources":["https://aiaphiladelphia.org/news/context-summer-2025/1477/1477-Up-Close-Jerry-Sweeney-","https://www.marketbeat.com/earnings/reports/2026-2-4-brandywine-realty-trust-stock/","https://www.bisnow.com/news/philadelphia/commercial-real-estate/brandywine-3025-jfk-refinance-q1-2026-134268","https://www.bisnow.com/news/philadelphia/office/brandywine-realty-trust-first-office-tenant-schuylkill-yards-tenant-goodwin-procter-120587"],"type":"company","body":"Brandywine Realty Trust (NYSE: BDN) owns, develops and manages about 20 million square feet of office, life science, residential and mixed-use space, concentrated in Philadelphia and Austin. Founded in 1994 by President and CEO Jerry Sweeney, it built Cira Centre (2005) and Cira Centre South in University City and in 2016 launched Schuylkill Yards with Drexel University, a $3.5 billion, 14-acre master plan over the Amtrak rail yards beside 30th Street Station. Completed pieces include Drexel Square (2019), the 28-story 3025 JFK Boulevard (326 Avira apartments over 200,000 square feet of commercial space, completed 2023, co-developed with Gotham Organization), the 400,000 square foot 3151 Market Street lab building and Highline Park. In late 2025 Brandywine bought out its joint venture partners in both Schuylkill Yards buildings. At year-end 2025, 3025 JFK's commercial space was 92 percent leased.","crumb":"Companies","related":["schuylkill-yards","cira-centre"],"people":["jerry-sweeney","jeff-devuono"],"when":"Thu 11:00 AM"},"kss-architects":{"id":"kss-architects","name":"KSS Architects","category":"architect","hq":"Princeton, NJ (offices in Philadelphia and New York)","founded":"1983","website":"https://kssarchitects.com","one_liner":"Architecture firm behind Philadelphia's first six-story mass timber building.","why_it_matters":"Amy Gutmann Hall shows a US university accepting mass timber for a lab-heavy academic building under Type III-A code, with the acoustic, fire and vibration details worked out. For Japanese contractors and developers weighing CLT above four stories, it is a documented precedent on cost, carbon and coordination between design architect, local architect, engineer and timber supplier.","fun_facts":["The building has a 12,000 square foot green roof and natural views from more than 77 percent of occupied spaces.","Mayva Donnon was inducted into The Carpenters' Company, the 300-year-old guild whose founders built Carpenters' Hall, in January 2024.","KSS also designed Tangen Hall, the Penn Venture Lab building the delegation visits on Thursday."],"presenting_slot":"Thursday, October 22, 10:00 AM: Amy Gutmann Hall tour","logo_query":"KSS Architects logo","sources":["https://www.woodworks.org/award-gallery/amy-gutmann-hall-data-science-ai-building/","https://dev.kssarchitects.com/projects/amy-gutmann-hall,-new-data-science-building/","https://tradelineinc.com/news/2024-10/university-pennsylvania-dedicates-amy-gutmann-hall","https://kssarchitects.com/journal/aia-awards-season-recognition/"],"type":"company","body":"KSS Architects, founded in 1983 in Princeton, New Jersey, is a 70-plus person firm with offices in Princeton, Philadelphia and New York working on higher education, K-12 and community buildings. With Lake|Flato as design architect, KSS was associate architect for Amy Gutmann Hall, Penn Engineering's 116,000 square foot data science and AI building: six stories of cross-laminated timber panels on glulam beams and columns, structural engineering by Buro Happold and construction by Gilbane using design-assist for the timber package. Dedicated in September 2024 at a reported cost of $140 million, it is Penn's first mass timber building and the first six-story mass timber building in Philadelphia; the firm says the timber structure cut embodied carbon 52 percent versus concrete. It won the 2026 WoodWorks Wood in Architecture award and AIA Philadelphia, New Jersey and New York honors in January 2026.","crumb":"Companies","related":["amy-gutmann-hall"],"people":["mayva-donnon"],"when":"Thu 10:00 AM"},"dave-mccormick":{"id":"dave-mccormick","name":"Senator Dave McCormick","title":"United States Senator for Pennsylvania","organization":"United States Senate","company_id":null,"presenting_slot":"Wednesday, October 21, 5:40 PM: welcome remarks at the closing dinner, Stotesbury Mansion","photo_query":"Senator Dave McCormick official portrait","sources":["https://www.mccormick.senate.gov/about/","https://en.wikipedia.org/wiki/Dave_McCormick"],"type":"person","body":"David H. McCormick has served as a United States Senator from Pennsylvania since January 3, 2025, after winning the November 2024 election. Born in Washington, Pennsylvania, and raised in Bloomsburg, he graduated from West Point in 1987, served five years as an Army paratrooper in the 82nd Airborne Division, including the Gulf War, where he earned a Bronze Star, and later completed a Ph.D. in international relations at Princeton. He was CEO of software company FreeMarkets, Under Secretary of the Treasury for International Affairs (2007-2009), and CEO of Bridgewater Associates until 2022. He serves on the Banking, Housing and Urban Affairs, Energy and Natural Resources, and Foreign Relations committees.","crumb":"People","profile":"https://www.mccormick.senate.gov/about/","sub":"United States Senator for Pennsylvania, United States Senate","when":"Wed 5:40 PM"},"vaughan-buckley":{"id":"vaughan-buckley","name":"Vaughan Buckley","title":"Founder and CEO","organization":"Volumetric Building Companies","company_id":"vbc","presenting_slot":"Wednesday, October 21, 3:30 PM: closing keynote, Christ Church Neighborhood House","photo_query":"Vaughan Buckley VBC CEO headshot","sources":["https://www.iwbcc.com/speakers/tracks/vaughan-buckley/","https://www.connectcre.com/stories/volumetric-building-companies-nears-completion-of-seven-story-development/","https://www.probuilder.com/business-management/qa/article/55198446/vaughan-buckley-on-restarting-a-former-katerra-factory","https://www.idaireland.com/latest-news/press-release/building-companies-celebrate-official-opening-of-global-centre-of-excellence"],"type":"person","body":"Vaughan Buckley is founder and CEO of Volumetric Building Companies, which he started in Philadelphia in 2009. He holds an MBA in international business and a law degree. Under his direction VBC grew from a regional modular contractor into a manufacturer with factories in Tracy, California (the former Katerra plant, acquired out of bankruptcy in 2021), Berwick, Pennsylvania, and Chojnice, Poland, after a 2022 merger with Polcom. He has publicly set a goal of $1 billion in annual revenue and has spoken openly about the lessons of Katerra's collapse. VBC says projects worth more than $1 billion have been built with modules designed, manufactured or assembled under his direction.","crumb":"People","profile":"https://www.iwbcc.com/speakers/tracks/vaughan-buckley/","sub":"Founder and CEO, Volumetric Building Companies","when":"Wed 3:30 PM"},"conley-oster":{"id":"conley-oster","name":"Conley Oster","title":"Co-Founder and Chief Operating Officer","organization":"Raise Robotics","company_id":"raise-robotics","presenting_slot":"Wednesday, October 21, 1:40 PM: startup presentations, Christ Church Neighborhood House","photo_query":"Conley Oster Raise Robotics headshot","sources":["https://www.robobusiness.com/speaker/conley-oster/","https://projectproduction.org/bios/conley-oster/","https://www.enr.com/articles/61108-raise-robotics-nets-775m-in-seed-funding-to-build-out-multipurpose-robot-platform","https://usg.mydigitalpublication.com/articles/three-days-one-big-step"],"type":"person","body":"Conley Oster is co-founder and Chief Operating Officer of Raise Robotics, where he leads field operations, sales and business development. He studied structural engineering at Penn State and spent his early career as a project manager and in sales for large crane and rigging companies, including Bigge Crane and Rigging in San Francisco, where he saw the slab-edge work Raise now automates. He co-founded the company in 2021 with CEO Gary Chen, a former Waymo engineer. Oster is a regular industry speaker and the public face of Raise's union training partnership with the IUPAT Glaziers, which certified about two dozen trainers in Philadelphia in July 2025.","crumb":"People","profile":"https://www.robobusiness.com/speaker/conley-oster/","sub":"Co-Founder and Chief Operating Officer, Raise Robotics","flag":"To confirm: likely presenter (co-founder and COO); note the CEO is Gary Chen, not Oster","when":"Wed 1:40 PM"},"ted-baumgardner":{"id":"ted-baumgardner","name":"Ted Baumgardner","title":"Founder and President (listed as CEO on the company website)","organization":"Guthrie AI","company_id":"guthrie-ai","presenting_slot":"Wednesday, October 21, 1:55 PM: startup presentations, Christ Church Neighborhood House","photo_query":"Ted Baumgardner Guthrie AI founder headshot","sources":["https://www.bisnow.com/news/philadelphia/construction-development/guthrie-ai-seed-round-ai-construction-bids-135510","https://www.mychesco.com/a/news/regional/guthrie-ai-raises-4-million-to-expand-construction-platform/","https://www.techcompanynews.com/guthrie-ai-raises-4m-in-seed-funding-round/"],"type":"person","body":"Ted Baumgardner is founder and president of Guthrie AI. A New Jersey native now living in Philadelphia, he served eight years in the U.S. Marine Corps as a ground intelligence officer, then worked as a glazing estimator, having grown up doing takeoffs in his family's glass business. He earned an MBA (and, per one report, a law degree) at the University of Pennsylvania. He piloted the virtual bid assistant model with glazing contractors for two years before building the software in 2024, funded the company from cash flow, and in 2026 raised a $4 million seed round led by Chicago Ventures. Tuneer De is co-founder and head of product.","crumb":"People","profile":"https://www.guthrieai.com","sub":"Founder and President (listed as CEO on the company website), Guthrie AI","flag":"To confirm: likely presenter (founder); co-founder Tuneer De is also possible","when":"Wed 1:55 PM"},"margaret-zhu":{"id":"margaret-zhu","name":"Margaret Zhu","title":"Co-Founder","organization":"Serpent Robotics","company_id":"serpent-robotics","presenting_slot":"Wednesday, October 21, 2:10 PM: startup presentations, Christ Church Neighborhood House","photo_query":"Margaret Zhu Wharton Serpent Robotics President's Innovation Prize","sources":["https://penntoday.upenn.edu/news/presidents-innovation-prize-margaret-zhu-serpent-robotics","https://alumni.wharton.upenn.edu/story/wharton-undergrad-margaret-zhu-receives-2026-presidents-innovation-prize/","https://www.engineering.upenn.edu/stories/class-of-2026-presidents-engagement-and-innovation-prize-winners-announced/"],"type":"person","body":"Margaret Zhu is co-founder of Serpent Robotics and a fourth-year finance major at the Wharton School (Class of 2026) from Short Hills, New Jersey. She formed the team in fall 2024 for Penn's Y-Prize competition with Integrated Product Design master's students Steyn Knollema, Jason Li and Yiran Xuan, building on robotics from Professor Mark Yim's lab. The company won the Robert S. Blank New Venture Collaboration Award and audience choice at Venture Lab's 2025 Startup Challenge, and the 2025 Pennovation Accelerator overall prize. In 2026 Penn named her a President's Innovation Prize winner, which provides $100,000 plus a $50,000 living stipend to run pilots with tree care companies after graduation.","crumb":"People","profile":"https://penntoday.upenn.edu/news/presidents-innovation-prize-margaret-zhu-serpent-robotics","sub":"Co-Founder, Serpent Robotics","flag":"To confirm: likely presenter (co-founder); named in GWV's internal showcase roster","when":"Wed 2:10 PM"},"charlie-andersen":{"id":"charlie-andersen","name":"Charlie Andersen","title":"Co-Founder and CEO","organization":"Burro","company_id":"burro","presenting_slot":"Wednesday, October 21, 2:25 PM: startup presentations, Christ Church Neighborhood House","photo_query":"Charlie Andersen Burro CEO headshot","sources":["https://burro.ai/about/","https://siliconvalleyinvestclub.com/ar/companies/burro/team/charlie-andersen/","https://foundingphilly.buzzsprout.com/2017333/episodes/15122128-burro-ceo-co-founder-charlie-andersen-founding-philly-ep-41","https://technical.ly/startups/robotics-philadelphia-burro-series-b-raise"],"type":"person","body":"Charlie Andersen is co-founder and CEO of Burro, which he started in Philadelphia in 2017 as Augean Robotics. He grew up in his family's fruit and vegetable farm and construction business, where he was the designated machine guy, and holds a B.A. from Amherst College and an MBA from Harvard Business School. Before Burro he worked at CNH Industrial (Case New Holland) on projects spanning sales, manufacturing, distribution and autonomy acquisitions. Under his leadership Burro has deployed hundreds of robots, grown to roughly 50 employees, raised an $11 million Series A in 2021 and a $24 million Series B in January 2024, and joined John Deere's agtech accelerator.","crumb":"People","profile":"https://burro.ai/about/","sub":"Co-Founder and CEO, Burro","flag":"To confirm: likely presenter (CEO)","when":"Wed 2:25 PM"},"hannes-blaas":{"id":"hannes-blaas","name":"Hannes Blaas","title":"CEO, Rotho Blaas USA Inc.","organization":"Rothoblaas","company_id":"rothoblaas","presenting_slot":"Wednesday, October 21, 3:00 PM: Innovative real estate session, Christ Church Neighborhood House; also joins the Amy Gutmann Hall tour Thursday 10:00 AM","photo_query":"Hannes Blaas Rothoblaas USA CEO","sources":["https://tfguild.org/events/2023-annual-conference/tab/speakers/24","https://www.rothoblaas.com/company-rothoblaas","https://www.eventbrite.com/cc/southeast-usa-timber-connections-3888913"],"type":"person","body":"Hannes Blaas is CEO of Rotho Blaas USA Inc., the New York-based subsidiary of the South Tyrolean timber construction hardware company founded in 1991. He has followed modern timber construction across several markets, working in Switzerland, the United Kingdom, Canada, the United States and most recently China before leading the US business, which supplies connectors, screws, membranes, acoustic layers and fall protection for mass timber projects from a US warehouse. He speaks regularly at North American timber events, including the Timber Framers Guild 2023 conference (Better Buildings: Acoustics, Envelope and Structural) and Rothoblaas Timber Connections roadshows in the Southeast and Northwest. His education and prior titles are not published.","crumb":"People","profile":"https://tfguild.org/events/2023-annual-conference/tab/speakers/24","sub":"CEO, Rotho Blaas USA Inc., Rothoblaas","flag":"To confirm: likely presenter (US CEO); title confirmed by Timber Framers Guild speaker bio and his own email signature","when":"Wed 3:00 PM"},"greg-gleicher":{"id":"greg-gleicher","name":"Greg Gleicher","title":"Founder and CEO","organization":"Good Developments Group (Gateway South)","company_id":"gateway-south","presenting_slot":"Wednesday, October 21, 3:15 PM: Innovative real estate session, Christ Church Neighborhood House","photo_query":"Greg Gleicher Good Developments Group","sources":["https://www.stlmag.com/business/greg-gleicher-good-developments-group","https://www.firstalert4.com/2022/11/22/exclusive-details-project-promising-transform-downtown-st-louis-mississippi-riverfront-global-construction-industry/","https://gatewaysouthstl.com"],"type":"person","body":"Greg Gleicher is founder and CEO of Good Developments Group, which he started in 2021 to pursue offsite construction, creative rehabilitation and technology-led development, and is lead developer of Gateway South in St. Louis. Born in New York City, he earned a BSBA from Washington University in St. Louis and began his career at JDS Development Group in New York, whose portfolio includes Brooklyn Tower and the American Copper Buildings. At Gateway South he has assembled roughly 100 acres of riverfront industrial land, secured Port Authority and city redevelopment agreements and tax incentives, and recruited partners including Vault Partners (industrial development) and Millstone Capital Advisors.","crumb":"People","profile":"https://www.stlmag.com/business/greg-gleicher-good-developments-group","sub":"Founder and CEO, Good Developments Group (Gateway South)","flag":"To confirm: likely presenter for the Gateway South slot (founder and CEO); not named in the schedule","when":"Wed 3:15 PM"},"leo-addimando":{"id":"leo-addimando","name":"Leo Addimando","title":"Co-Founder and Managing Partner","organization":"Alterra Property Group","company_id":"alterra","presenting_slot":"Tuesday, October 20, 9:15 AM: hosts the 510 N. Broad, Wanamaker Building and 17 Market West tours","photo_query":"Leo Addimando Alterra Property Group headshot","sources":["https://phlforecast.uli.org/speakers/leo-addimando/","https://www.bisnow.com/news/philadelphia/adaptive-reuse/wanamaker-building-conversion-tf-cornerstone-alterra-129758","https://www.inquirer.com/real-estate/1701-market-office-to-residential-conversion-alterra-property-group-20250203.html","https://www.bisnow.com/news/philadelphia/capital-markets/alterra-raises-nearly-1b-for-its-industrial-outdoor-fund-123788"],"type":"person","body":"Leonidas (Leo) Addimando is co-founder and managing partner of Alterra Property Group, which he has led since entering real estate in 2004. Born in Philadelphia, he holds a B.A. in economics and political science from the University of Michigan and an MBA from Harvard Business School, and earlier worked at Boston Consulting Group and as an early employee of Orbitz. He has personally completed more than 1,000 residential units across 15 states, built Alterra's $900 million-plus industrial outdoor storage fund platform, and leads the 17 Market West and Wanamaker Building conversions. He serves on the boards of the Preservation Alliance of Greater Philadelphia and Old City District.","crumb":"People","profile":"https://phlforecast.uli.org/speakers/leo-addimando/","sub":"Co-Founder and Managing Partner, Alterra Property Group","flag":"To confirm: likely host (managing partner) for the Alterra-hosted tours; other Alterra executives (Mark Cartella, SVP Development and Construction; Connor Burke, VP Multifamily Acquisition) may lead on site","when":"Tue 9:15 AM"},"ali-volpe":{"id":"ali-volpe","name":"Ali Volpe","title":"Founder, Lotus Living; Partner, Flow Development","organization":"Lily Development / Lotus Living","company_id":"lily-development","presenting_slot":"Wednesday, October 21, 10:30 AM: Lotus Residences tour","photo_query":"Ali Volpe Lotus Philadelphia founder","sources":["https://www.phillymag.com/be-well-philly/2025/01/21/lotus-wellness-apartments/","https://www.lotus.living/","https://www.ocfrealty.com/naked-philly/old-city/demo-clears-way-for-nature-focused-lotus-lofts-in-old-city/"],"type":"person","body":"Alexandra (Ali) Volpe is founder of Lotus Living and a partner in Flow Development, the team behind Lotus at 416 Vine Street in Old City, developed under Lily Development. She began her career as a school counselor supporting students' mental and behavioral health, then moved into real estate development to work on community well-being at a larger scale. She cites the Blue Zones research on longevity as inspiration and built Lotus on three principles: biophilic design, amenities for heart, mind, body and soul, and programming that fosters connection. She has said additional Lotus locations in Philadelphia are planned over the next two to three years.","crumb":"People","profile":"https://www.lotus.living/","sub":"Founder, Lotus Living; Partner, Flow Development, Lily Development / Lotus Living","when":"Wed 10:30 AM"},"jerry-sweeney":{"id":"jerry-sweeney","name":"Jerry Sweeney","title":"President, CEO and Trustee","organization":"Brandywine Realty Trust","company_id":"brandywine","presenting_slot":"Thursday, October 22, 11:00 AM: Schuylkill Yards tour, ending at Cira Centre","photo_query":"Jerry Sweeney Brandywine Realty Trust CEO headshot","sources":["https://aiaphiladelphia.org/news/context-summer-2025/1477/1477-Up-Close-Jerry-Sweeney-","https://www.fox.temple.edu/news/2016/11/gerard-h-sweeney-receive-20th-annual-musser-award-excellence-leadership","https://blog.brandywinerealty.com/en/brandywine-ceo-named-to-philadelphia-business-journal-2024-power-100-list","https://www.marketbeat.com/earnings/reports/2026-2-4-brandywine-realty-trust-stock/"],"type":"person","body":"Gerard H. (Jerry) Sweeney is president, CEO and trustee of Brandywine Realty Trust, which he founded in 1994 with an assistant and four small buildings and grew into a NYSE-listed REIT with about 20 million square feet. A Delaware County native and West Chester University economics graduate, he began in accounting, worked in construction controls at Scott Paper's Maine mill and became a partner at a private Philadelphia developer before Brandywine. He led the company into University City with Cira Centre (2005) and the $3.5 billion Schuylkill Yards partnership with Drexel. Temple's Fox School gave him its Musser Award for Excellence in Leadership in 2016.","crumb":"People","profile":"https://www.brandywinerealty.com/leadership","sub":"President, CEO and Trustee, Brandywine Realty Trust","flag":"To confirm: likely presenter (CEO)","when":"Thu 11:00 AM"},"jeff-devuono":{"id":"jeff-devuono","name":"H. Jeffrey DeVuono","title":"Executive Vice President and Senior Managing Director, Life Science; Regi
