<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LP Summit Philadelphia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column (max 640px). Deep Navy band on top, white page, hairline tab bar below.
   Tokens are the Great Wave Ventures design system (GWV Brand Guidelines v6-12-2026): Wave Blue, Deep Navy, Slate, cream editorial surface. */
:root {
  --gwv-wave-blue: #396B8C; --gwv-deep-navy: #0F2440; --gwv-slate: #334155; --gwv-ink: #0A2C54; --gwv-cream: #F6F2DC;
  --blue-50: #EEF3F7; --blue-100: #D8E4EC; --blue-200: #B4C9D8; --blue-300: #89A9C0; --blue-600: #2E5674; --blue-700: #24425A; --blue-800: #1A3049;
  --neutral-50: #F8FAFC; --neutral-100: #F1F5F9; --neutral-200: #E2E8F0; --neutral-300: #CBD5E1; --neutral-400: #94A3B8; --neutral-500: #64748B;
  --cream-200: #EBE5C8; --cream-300: #D9D2AE;
  --status-positive: #2F6B4F; --status-positive-surface: #E8F1EC; --status-caution: #8C6A2B; --status-caution-surface: #F6EFDF;

  --surface-page: #FFFFFF; --surface-card: #FFFFFF; --surface-sunken: var(--neutral-100); --surface-editorial: var(--gwv-cream);
  --surface-inverse: var(--gwv-deep-navy); --surface-inverse-alt: var(--blue-800); --surface-brand-subtle: var(--blue-50);
  --text-heading: var(--gwv-deep-navy); --text-body: var(--gwv-slate); --text-muted: var(--neutral-500); --text-brand: var(--gwv-wave-blue);
  --text-link: var(--gwv-wave-blue); --text-link-hover: var(--blue-700); --text-on-editorial: var(--gwv-ink);
  --border-subtle: var(--neutral-200); --border-default: var(--neutral-300); --border-brand: var(--gwv-wave-blue);
  --text-inverse: #FFFFFF; --text-inverse-muted: rgba(255,255,255,.72); --border-inverse: rgba(255,255,255,.18); --glass-inverse: rgba(255,255,255,.08);
  --tag-selected-bg: var(--gwv-wave-blue); --tag-selected-fg: #FFFFFF;
  --shadow-xs: 0 1px 2px rgba(15,36,64,.06); --shadow-md: 0 4px 12px rgba(15,36,64,.08);
  --focus-ring: rgba(57,107,140,.45);
  --font-display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Carlito', 'Calibri', 'Helvetica Neue', Arial, sans-serif;
  --font-editorial: Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --font-ja: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --ease: cubic-bezier(.2,.6,.2,1); --fast: 140ms; --base: 200ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface-page: #0F2440; --surface-card: #1A3049; --surface-sunken: #0A1A33; --surface-editorial: #24425A; --surface-inverse: #0A2C54; --surface-inverse-alt: #1A3049; --surface-brand-subtle: #1A3049;
  --text-heading: #FFFFFF; --text-body: rgba(255,255,255,.80); --text-muted: rgba(255,255,255,.60); --text-brand: #89A9C0; --text-link: #B4C9D8; --text-link-hover: #FFFFFF; --text-on-editorial: #FFFFFF;
  --border-subtle: rgba(255,255,255,.14); --border-default: rgba(255,255,255,.24); --border-brand: #89A9C0;
  --status-positive: #9FD3B8; --status-positive-surface: #173A33; --status-caution: #E3C98A; --status-caution-surface: #3E3418;
  --tag-selected-bg: #89A9C0; --tag-selected-fg: #0F2440; --shadow-xs: none; --shadow-md: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface-page: #0F2440; --surface-card: #1A3049; --surface-sunken: #0A1A33; --surface-editorial: #24425A; --surface-inverse: #0A2C54; --surface-inverse-alt: #1A3049; --surface-brand-subtle: #1A3049;
  --text-heading: #FFFFFF; --text-body: rgba(255,255,255,.80); --text-muted: rgba(255,255,255,.60); --text-brand: #89A9C0; --text-link: #B4C9D8; --text-link-hover: #FFFFFF; --text-on-editorial: #FFFFFF;
  --border-subtle: rgba(255,255,255,.14); --border-default: rgba(255,255,255,.24); --border-brand: #89A9C0;
  --status-positive: #9FD3B8; --status-positive-surface: #173A33; --status-caution: #E3C98A; --status-caution-surface: #3E3418;
  --tag-selected-bg: #89A9C0; --tag-selected-fg: #0F2440; --shadow-xs: none; --shadow-md: none; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface-page); color: var(--text-body); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
:root[lang="ja"] body, :root[lang="ja"] .display, :root[lang="ja"] .eyebrow, :root[lang="ja"] button, :root[lang="ja"] .tab { font-family: var(--font-ja); }
:root[lang="ja"] .eyebrow, :root[lang="ja"] .tab, :root[lang="ja"] .btn { letter-spacing: .06em; text-transform: none; }
a { color: var(--text-link); text-decoration: none; border-bottom: 1px solid rgba(57,107,140,.32); transition: color var(--fast) var(--ease), border-color var(--fast) var(--ease); }
a:hover { color: var(--text-link-hover); border-bottom-color: currentColor; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; color: var(--text-heading); line-height: 1.24; }
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--text-brand); }
.on-navy .eyebrow, .eyebrow.on-navy { color: var(--text-inverse-muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 480px) { .wrap { padding-inline: 24px; } }
.btn { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; padding: 9px 14px; border: 1px solid var(--border-default); background: var(--surface-card); color: var(--text-heading); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background-color var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.btn:hover { background: var(--surface-brand-subtle); }
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--gwv-wave-blue); border-color: var(--gwv-wave-blue); color: #fff; }
.btn.primary:hover { background: var(--blue-600); border-color: var(--blue-600); }
.btn.inverse { background: var(--glass-inverse); border-color: var(--border-inverse); color: var(--text-inverse); }
.btn.inverse:hover { background: rgba(255,255,255,.14); }
.btn svg, .tab svg, .ico { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Navy band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface-inverse); color: var(--text-inverse); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.top img.roundel { height: 36px; width: 36px; display: block; }
.lang { display: flex; border: 1px solid var(--border-inverse); border-radius: 4px; overflow: hidden; flex: none; background: var(--glass-inverse); }
.lang button { background: transparent; border: 0; padding: 7px 11px; font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--text-inverse-muted); transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.lang button[aria-pressed="true"] { background: #fff; color: var(--gwv-deep-navy); }
.hero { background: var(--surface-inverse); color: var(--text-inverse); position: relative; overflow: hidden; }
.hero .wrap { padding-block: 10px 24px; position: relative; z-index: 1; }
.hero img.lockup { width: 220px; height: auto; display: block; margin: 0 0 18px; }
.hero img.mark { position: absolute; right: -80px; top: -10px; width: 260px; opacity: .10; pointer-events: none; }
.hero h1 { margin: 4px 0 0; font-size: 25px; color: #fff; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--text-inverse-muted); font-size: 16px; max-width: 42ch; }

/* Banners */
.banner { border-bottom: 1px solid var(--border-subtle); background: var(--status-caution-surface); color: var(--text-heading); }
.banner .wrap { display: flex; align-items: center; gap: 12px; padding-block: 9px; font-size: 15px; }
.banner strong { color: var(--status-caution); font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.banner .btn { margin-left: auto; padding: 6px 10px; font-size: 11px; }

main { padding-block: 18px calc(88px + env(safe-area-inset-bottom, 0px)); }
.view[hidden] { display: none; }
.section-title { margin: 26px 0 10px; font-size: 20px; font-weight: 600; }
.section-title:first-child { margin-top: 4px; }
.lede { color: var(--text-muted); margin: 0 0 12px; font-size: 16px; }

/* Day tags */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--border-default); background: var(--surface-card); border-radius: 999px; padding: 7px 14px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; line-height: 1.2; font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-heading); transition: background-color var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.chip small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--tag-selected-bg); color: var(--tag-selected-fg); border-color: var(--tag-selected-bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.chip .today { font-size: 10px; letter-spacing: .12em; color: var(--status-positive); }
.chip[aria-pressed="true"] .today { color: inherit; }
:root[lang="ja"] .chip { letter-spacing: .04em; text-transform: none; }

.dayhead { border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); padding: 14px 0; margin-bottom: 6px; }
.dayhead h2 { margin: 4px 0 2px; font-size: 25px; }
.dayhead p { margin: 4px 0 0; font-size: 16px; color: var(--text-muted); }
.dayhead .theme { color: var(--text-body); font-family: var(--font-editorial); font-size: 17px; }
.dayhead .warn { color: var(--status-caution); }
.dayhead .label { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-right: 6px; }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 72px 1fr; gap: 0 12px; padding: 11px 0; border-bottom: 1px solid var(--border-subtle); }
.item .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--text-muted); padding-top: 3px; white-space: nowrap; }
.item .body { min-width: 0; }
.item .title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; color: var(--text-heading); }
.item .title button { background: none; border: 0; padding: 0; text-align: left; font: inherit; cursor: pointer; color: var(--text-link); border-bottom: 1px solid rgba(57,107,140,.32); transition: color var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.item .title button:hover { color: var(--text-link-hover); border-bottom-color: currentColor; }
.item .host { margin: 3px 0 0; font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-brand); }
.item .detail { margin: 3px 0 0; font-size: 15.5px; color: var(--text-muted); }
.item .stops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tagbtn { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 999px; padding: 4px 11px; font-size: 14px; cursor: pointer; color: var(--text-heading); transition: background-color var(--fast) var(--ease); }
.tagbtn:hover { background: var(--surface-brand-subtle); }
.item.now { background: var(--status-positive-surface); margin-inline: -16px; padding-inline: 16px; border-bottom-color: transparent; }
.item .state { display: inline-block; font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--status-positive); margin-left: 8px; vertical-align: middle; }
.item.talk .time::after { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--gwv-wave-blue); margin-left: 7px; vertical-align: middle; }

/* Cards */
.cards { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; cursor: pointer; text-align: left; width: 100%; box-shadow: var(--shadow-xs); transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--border-default); }
.card:active { transform: scale(.985); }
.card .name { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; line-height: 1.3; color: var(--text-heading); letter-spacing: -.005em; }
.card .sub { color: var(--text-muted); font-size: 15px; margin: 0; grid-column: 1; }
.card .tag { grid-row: 1 / span 2; align-self: start; font-family: var(--font-mono); font-size: 12px; color: var(--text-brand); background: var(--surface-brand-subtle); border-radius: 2px; padding: 3px 7px; white-space: nowrap; }
.card .tag.talk { color: var(--status-positive); background: var(--status-positive-surface); }

/* Essentials */
.panel { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-xs); }
.panel h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.panel p { margin: 6px 0; font-size: 16px; }
.driver { background: var(--surface-inverse); color: var(--text-inverse); border-radius: 10px; padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
.driver img.mark { position: absolute; right: -60px; bottom: -70px; width: 220px; opacity: .10; pointer-events: none; }
.driver > * { position: relative; z-index: 1; }
.driver p.big { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.3; margin: 8px 0 8px; color: #fff; letter-spacing: -.005em; }
.driver p.addr { margin: 0 0 12px; font-family: var(--font-mono); font-size: 14px; color: var(--text-inverse-muted); }
.driver .row { display: flex; gap: 8px; flex-wrap: wrap; }
.driver a.btn { border-bottom: 1px solid var(--border-inverse); }
.contact { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--border-subtle); }
.contact:first-of-type { border-top: 0; padding-top: 2px; }
.contact .n { font-weight: 700; color: var(--text-heading); grid-column: 1; }
.contact .r { color: var(--text-muted); font-size: 15px; grid-column: 1; }
.contact .p { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--font-mono); font-size: 15px; user-select: all; text-align: right; color: var(--text-heading); }
.contact .p.missing { color: var(--status-caution); }
.linkish { background: none; border: 0; padding: 0; color: var(--text-link); border-bottom: 1px solid rgba(57,107,140,.32); cursor: pointer; font: inherit; }

/* Entry sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--surface-page); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet[hidden] { display: none; }
.sheet .bar { position: sticky; top: 0; background: var(--surface-inverse); color: var(--text-inverse); display: flex; align-items: center; gap: 12px; padding: 10px 16px; z-index: 2; }
.sheet .bar .crumb { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--text-inverse-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .inner { max-width: 640px; margin: 0 auto; padding: 18px 16px 56px; }
@media (min-width: 480px) { .sheet .inner { padding-inline: 24px; } }
.photo { border: 1px dashed var(--border-default); border-radius: 10px; padding: 14px 16px; margin: 0 0 18px; font-size: 14px; color: var(--text-muted); background: var(--surface-sunken); aspect-ratio: 16 / 7; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.sheet h2 { margin: 0 0 6px; font-size: 25px; line-height: 1.16; text-wrap: balance; }
.sheet .oneliner { font-family: var(--font-editorial); font-size: 18px; line-height: 1.45; color: var(--text-body); margin: 0 0 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; color: var(--text-muted); margin-bottom: 16px; align-items: center; }
.meta .addr { font-family: var(--font-mono); font-size: 13.5px; }
.meta a { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.visit { background: var(--surface-brand-subtle); border: 1px solid var(--border-subtle); color: var(--text-body); padding: 10px 14px; border-radius: 10px; font-size: 16px; margin: 0 0 16px; }
.visit .eyebrow { margin-bottom: 3px; }
.prose { max-width: 62ch; font-family: var(--font-editorial); }
.prose p { margin: 0 0 14px; font-size: 17px; line-height: 1.65; }
.why { background: var(--surface-editorial); color: var(--text-on-editorial); padding: 16px 18px; border-radius: 10px; margin: 18px 0; }
.why .eyebrow { margin-bottom: 6px; }
.why p { margin: 0; font-family: var(--font-editorial); font-size: 16.5px; line-height: 1.6; }
.facts { margin: 8px 0 14px; padding: 0; list-style: none; }
.facts li { padding: 8px 0; border-top: 1px solid var(--border-subtle); font-size: 16px; display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
.facts li::before { content: ''; width: 6px; height: 6px; background: var(--gwv-wave-blue); margin-top: 8px; }
.facts-title { margin: 20px 0 2px; }
.related { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
.srcs { margin-top: 22px; font-size: 13px; color: var(--text-muted); }
.srcs summary { cursor: pointer; font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.srcs ul { padding-left: 18px; margin: 8px 0 0; }
.srcs li { overflow-wrap: anywhere; margin: 4px 0; }
.flagnote { font-size: 14.5px; color: var(--text-heading); background: var(--status-caution-surface); border-radius: 4px; padding: 8px 12px; margin: 0 0 14px; }
.flagnote::before { content: 'To confirm'; display: block; font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--status-caution); margin-bottom: 2px; }

/* Review notes */
.review ol { padding-left: 20px; margin: 0; }
.review li { margin: 0 0 12px; font-size: 15.5px; }
.review li strong { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--text-heading); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface-card); border-top: 1px solid var(--border-subtle); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding-inline: 4px; }
.tab { background: transparent; border: 0; border-top: 2px solid transparent; padding: 9px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-display); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; transition: color var(--fast) var(--ease); }
.tab svg { width: 20px; height: 20px; }
.tab[aria-pressed="true"] { color: var(--text-brand); border-top-color: var(--gwv-wave-blue); }
:root[lang="ja"] .tab { font-size: 11px; }

@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise var(--base) var(--ease); } @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (min-width: 700px) { .tabbar .wrap { max-width: 640px; } }
</style>

const DATA = {"days":[{"id":"mon","date":"2026-10-19","label":{"en":"Arrival","ja":"到着日"},"weekday":{"en":"Monday, October 19","ja":"10月19日（月）"},"dress":{"en":"At leisure","ja":"自由"},"note":{"en":"Monday is still being finalized. Rittenhouse walk and SkyHigh drinks are optional.","ja":"月曜日の予定は調整中です。"},"items":[{"time":null,"title":{"en":"Arrivals and check-in, The Bellevue Hotel"},"ref":"the-bellevue-hotel","detail":{"en":"Car service from PHL Airport or 30th Street Station. A briefing folder and welcome gift will be in your room."}},{"time":null,"title":{"en":"Rittenhouse Square walking tour (optional, about 90 min)"},"ref":"rittenhouse-square","detail":{"en":"Led by Michael. A 10-minute walk from the hotel."}},{"time":null,"title":{"en":"Evening at leisure"},"ref":null,"detail":{"en":"A short list of walk-in restaurants near the hotel is under Essentials."}},{"time":"20:00","title":{"en":"Welcome drinks, SkyHigh at the Four Seasons (optional)"},"ref":"skyhigh-four-seasons","detail":{"en":"60th floor of the Comcast Technology Center. Light snacks provided. 15-minute walk from the hotel."}}]},{"id":"tue","date":"2026-10-20","label":{"en":"Day One","ja":"1日目"},"weekday":{"en":"Tuesday, October 20","ja":"10月20日（火）"},"dress":{"en":"Business casual, comfortable shoes. The day runs straight into dinner.","ja":"ビジネスカジュアル、歩きやすい靴"},"theme":{"en":"Modular construction and office-to-residential conversion","ja":"モジュール建築とオフィスから住宅への転用"},"items":[{"time":"08:00","title":{"en":"Breakfast, The Bellevue, 19th floor"},"ref":"the-bellevue-hotel","detail":null},{"time":"09:00","title":{"en":"Depart hotel for 510 N. Broad Street"},"ref":null,"detail":{"en":"Shuttle, about 10 minutes."}},{"time":"09:15","title":{"en":"Site tour: 510 N. Broad (LVL North)"},"ref":"510-n-broad-lvl-north","host":{"en":"Alterra Property Group and VBC"},"detail":null},{"time":"10:30","title":{"en":"Depart 510 N. Broad"},"ref":null,"detail":null},{"time":"10:35","title":{"en":"Photo stop: 1314 Spring Garden Street"},"ref":"1314-spring-garden","detail":{"en":"VBC's own modular apartment building, five modular floors over a two-story podium."}},{"time":"10:45","title":{"en":"Walk the Rail Park toward the Wanamaker Building"},"ref":"rail-park","detail":null},{"time":"11:00","title":{"en":"Site tour: Wanamaker Building"},"ref":"wanamaker-building","host":{"en":"Alterra Property Group"},"detail":null},{"time":"12:30","title":{"en":"Lunch, Reading Terminal Market"},"ref":"reading-terminal-market","detail":{"en":"Order at any stall. Suggested: Hershel's East Side Deli, DiNic's Roast Pork."}},{"time":"14:00","title":{"en":"Site tour: 17 Market West"},"ref":"17-market-west","host":{"en":"Alterra Property Group"},"detail":{"en":"Philadelphia's largest office-to-residential conversion, 299 units."}},{"time":"15:30","title":{"en":"Free time"},"ref":null,"detail":{"en":"Five-minute walk back to the hotel."}},{"time":"17:00","title":{"en":"Welcome dinner, Her Place Supper Club"},"ref":"her-place-supper-club","detail":{"en":"Full buyout of the restaurant. Cocktails at 5:00, seated dinner from 6:00, ends 8:00."}},{"time":"20:00","title":{"en":"Evening at leisure"},"ref":null,"detail":null}]},{"id":"wed","date":"2026-10-21","label":{"en":"Day Two","ja":"2日目"},"weekday":{"en":"Wednesday, October 21","ja":"10月21日（水）"},"dress":{"en":"Business casual by day. Change at the hotel for the closing dinner (formal).","ja":"日中はビジネスカジュアル、夕食はフォーマル"},"theme":{"en":"Old City, the startup showcase and the closing dinner","ja":"オールドシティ、スタートアップ・ショーケース、クロージングディナー"},"items":[{"time":"08:00","title":{"en":"Breakfast, The Bellevue, 19th floor"},"ref":"the-bellevue-hotel","detail":null},{"time":"09:00","title":{"en":"Walking tour of Old City"},"ref":null,"detail":{"en":"Stops: Washington Square, Independence Hall (guided tour), Liberty Bell, Christ Church Burial Ground, Arch Street Meeting House."},"stops":["washington-square","independence-hall","liberty-bell-center","christ-church-burial-ground","arch-street-meeting-house"]},{"time":"10:30","title":{"en":"Developer tour: Lotus Residences & Wellness Club"},"ref":"lotus-residences","host":{"en":"Ali Volpe, Lotus Living"},"detail":null},{"time":"11:30","title":{"en":"Walk to Christ Church"},"ref":null,"detail":{"en":"Via Elfreth's Alley and Christ Church."},"stops":["elfreths-alley","christ-church"]},{"time":"12:15","title":{"en":"Arrive, Christ Church Neighborhood House"},"ref":"christ-church-neighborhood-house","detail":null},{"time":"12:30","title":{"en":"Lunch (catered), the Great Hall"},"ref":"christ-church-neighborhood-house","detail":null},{"time":"13:30","title":{"en":"Startup presentations begin"},"ref":null,"detail":{"en":"Welcome remarks by Michael Palmer at 1:35."}},{"time":"13:40","title":{"en":"Raise Robotics"},"ref":"raise-robotics","kind":"talk","detail":null},{"time":"13:55","title":{"en":"Guthrie AI"},"ref":"guthrie-ai","kind":"talk","detail":null},{"time":"14:10","title":{"en":"Serpent Robotics"},"ref":"serpent-robotics","kind":"talk","detail":null},{"time":"14:25","title":{"en":"Burro"},"ref":"burro","kind":"talk","detail":null},{"time":"14:40","title":{"en":"Break and networking"},"ref":null,"detail":null},{"time":"15:00","title":{"en":"Innovative real estate: Rothoblaas"},"ref":"rothoblaas","kind":"talk","detail":null},{"time":"15:15","title":{"en":"Innovative real estate: Gateway South"},"ref":"gateway-south","kind":"talk","detail":null},{"time":"15:30","title":{"en":"Keynote: Volumetric Building Companies"},"ref":"vbc","kind":"talk","detail":null},{"time":"16:00","title":{"en":"Return to hotel and change for dinner"},"ref":null,"detail":null},{"time":"17:30","title":{"en":"Arrive, Stotesbury Mansion"},"ref":"stotesbury-mansion","detail":{"en":"1923 Walnut Street, a 5-minute walk from the hotel."}},{"time":"17:35","title":{"en":"Welcome address, Nobu Iguchi"},"ref":null,"detail":null},{"time":"17:40","title":{"en":"Remarks, Senator Dave McCormick"},"ref":"dave-mccormick","detail":null},{"time":"18:15","title":{"en":"Closing dinner"},"ref":"stotesbury-mansion","detail":{"en":"Catered by Feast Your Eyes. Developers and founders the group has met join for drinks afterward."}},{"time":"20:00","title":{"en":"Dinner ends, open reception"},"ref":null,"detail":null},{"time":"22:00","title":{"en":"Evening concludes"},"ref":null,"detail":null}]},{"id":"thu","date":"2026-10-22","label":{"en":"Day Three","ja":"3日目"},"weekday":{"en":"Thursday, October 22","ja":"10月22日（木）"},"dress":{"en":"Business casual. Check out before departing for Penn.","ja":"ビジネスカジュアル"},"theme":{"en":"University of Pennsylvania: mass timber, Schuylkill Yards and Venture Lab","ja":"ペンシルベニア大学：マスティンバー、スクールキル・ヤーズ、ベンチャーラボ"},"items":[{"time":"08:00","title":{"en":"Breakfast and checkout, The Bellevue"},"ref":"the-bellevue-hotel","detail":{"en":"Luggage can be held at the hotel for later pickup."}},{"time":"09:30","title":{"en":"Depart hotel for the University of Pennsylvania"},"ref":null,"detail":{"en":"Shuttle, about 15 minutes."}},{"time":"10:00","title":{"en":"Tour: Amy Gutmann Hall (mass timber)"},"ref":"amy-gutmann-hall","host":{"en":"Penn and KSS Architects, with Rothoblaas"},"detail":null},{"time":"10:45","title":{"en":"Depart Amy Gutmann Hall"},"ref":null,"detail":null},{"time":"11:00","title":{"en":"Brandywine Realty Trust: Schuylkill Yards tour"},"ref":"schuylkill-yards","host":{"en":"Brandywine Realty Trust"},"detail":null},{"time":"11:45","title":{"en":"Tour concludes at Cira Centre"},"ref":"cira-centre","detail":null},{"time":"11:45","title":{"en":"Lunch with Wharton MBA students"},"ref":null,"detail":{"en":"Wharton Japan Club and Real Estate Club. Short introductions from each LP firm."}},{"time":"12:45","title":{"en":"Walk to Tangen Hall"},"ref":null,"detail":null},{"time":"13:00","title":{"en":"Tour: Penn Venture Lab, Tangen Hall"},"ref":"tangen-hall-venture-lab","detail":null},{"time":"13:45","title":{"en":"The Summit concludes"},"ref":null,"detail":{"en":"Car service to PHL Airport or 30th Street Station."}}]}],"index":{"washington-square":{"id":"washington-square","name":"Washington Square","address":"Walnut Street between 6th and 7th Streets (210 W. Washington Square), Philadelphia, PA 19106","one_liner":"A Penn-planned square that became a mass grave, then a quiet memorial park.","why_it_matters":"Penn reserved this green space before the city existed, which is why the five squares still anchor land values today. It is now a federal park bordered by private offices and homes: Jane Jacobs used it in 1961 as a cautionary example of a square with too few daytime users. The surrounding blocks, once home to publishers such as Curtis, Lippincott and Lea & Febiger, have since turned into residential and hotel conversions.","fun_facts":["In 1793 George Washington watched the first hot-air balloon flight in North America lift off from the prison yard beside the square.","The bronze Washington is a cast of Jean-Antoine Houdon's statue; the wall behind it reads 'Freedom is a light for which many men have died in darkness.'","A 'Moon Tree' sycamore grown from seeds flown on Apollo 14 was planted here in 1975; it died in 2009, but its plaque remains."],"visit_note":"The Wednesday walking tour passes through on the way to Independence Hall; it is an open public park with no ticket or closure risk, and the tomb and eternal flame are the stop.","image_query":"Washington Square Philadelphia Tomb of the Unknown Revolutionary War Soldier eternal flame","sources":["https://www.nps.gov/inde/learn/historyculture/places-washingtonsquare.htm","https://www.nps.gov/articles/000/tomb-of-the-unknown-revolutionary-war-soldier.htm","https://en.wikipedia.org/wiki/Washington_Square_(Philadelphia)","https://www.phillymag.com/news/2016/01/08/philadelphia-public-squares-william-penn"],"type":"place","body":"Washington Square is one of the five public squares in William Penn's 1682 plan for Philadelphia. First called Southeast Square, from 1706 it served as a potter's field, a public burial ground for the poor, strangers, and free and enslaved Africans. During the Revolutionary War thousands of American and British soldiers who died in the nearby Walnut Street Prison were buried here in mass graves; John Adams walked the ground in 1777 and wrote that more than two thousand soldiers lay beneath it. Victims of the 1793 yellow fever epidemic filled the last space, and the city closed the ground to burials in 1794. After 1815 it was landscaped as a park, and in 1825 it was renamed for George Washington. The Tomb of the Unknown Revolutionary War Soldier, designed by architect G. Edwin Brumbaugh, was completed in 1957, and the National Park Service took over the 6.4-acre square in 2005.","crumb":"Historic Philadelphia","when":"Wed 9:00 AM"},"independence-hall":{"id":"independence-hall","name":"Independence Hall","address":"520 Chestnut Street, Philadelphia, PA 19106","one_liner":"Where the Declaration of Independence and the US Constitution were both signed.","why_it_matters":"A modest provincial government building became national sacred ground, and now the Park Service must move 3 to 5 million visitors a year through a 270-year-old brick structure with no elevators, using timed tickets and security screening. The closure from October 2025 to January 2026 for preservation and interior work shows how federal heritage sites were readied for the Semiquincentennial.","fun_facts":["The Liberty Bell first rang from this building's tower in 1753; it moved across the street to its own pavilion in 2003.","The 'Rising Sun' chair and a carved frieze are the only original 1776-era artifacts still in the Assembly Room.","The hall closed for 119 days during the federal shutdown that began October 1, 2025, then stayed shut for repairs until January 29, 2026."],"visit_note":"The group's timed tour is Wednesday October 21, about 9:15 to 10:15 AM; tickets are free with a $1 fee via Recreation.gov, individual accounts are capped at 10 so a party of 30 is booked as a group, and everyone must clear security on Chestnut Street about 30 minutes before the tour; note NPS lists 9:00 to 9:50 AM as a no-ticket open house and ticketed guided tours from 10:00 AM, so confirm which format the 9:15 slot is.","image_query":"Independence Hall Philadelphia exterior clock tower","sources":["https://www.nps.gov/inde/planyourvisit/independencehalltickets.htm","https://www.nationalgeographic.com/travel/article/everything-to-know-about-independence-hall-world-heritage","https://whyy.org/articles/independence-hall-reopens-philadelphia/","https://home.nps.gov/inde/planyourvisit/hours.htm/index.htm"],"type":"place","body":"Built between 1732 and 1753 as the Pennsylvania State House, this brick Georgian building was designed by lawyer Andrew Hamilton with master builder Edmund Woolley for the colony's legislature. In its Assembly Room the Second Continental Congress adopted the Declaration of Independence on July 4, 1776, and in the same room delegates signed the United States Constitution on September 17, 1787. The original wooden steeple rotted and was removed in 1781; the present tower, about 168 feet tall, was added in 1828. The name Independence Hall entered official records in 1852. The National Park Service restored the interior to its 1776 appearance around 1950, and UNESCO inscribed the building as a World Heritage Site in 1979. Few original objects survive inside; the most important is the 'Rising Sun' chair from which George Washington presided over the Constitutional Convention. In January 2026 the hall reopened after a four-month closure for preservation work ahead of the 250th anniversary.","crumb":"Historic Philadelphia","flag":"To confirm: NPS lists a no-ticket open house 9:00 to 9:50 AM and ticketed tours from 10:00 AM; the group's 9:15 slot does not match either.","when":"Wed 9:00 AM"},"liberty-bell-center":{"id":"liberty-bell-center","name":"Liberty Bell Center","address":"526 Market Street, Philadelphia, PA 19106","one_liner":"A cracked 1753 bell that became the world's best-known symbol of liberty.","why_it_matters":"The 2003 center is a case study in building on contested ground: it sits partly on the footprint of the President's House, where George Washington's enslaved workers lived, and protests pushed the Park Service to add interpretation of slavery beside the entrance. The design, a low granite-and-glass pavilion whose gently sloping floor leads to the bell chamber, shows how one artifact can organize an entire visitor sequence.","fun_facts":["Nearly two million people kissed the bell at the 1915 Panama-Pacific Exposition in San Francisco, its last trip outside Philadelphia.","On July 4 and a few other dates the bell is tapped, never rung, with a soft mallet by white-gloved hands; it has not rung since 1846.","Visitors have not been allowed to touch it since a 2001 attack with a hammer; everyone now passes through security screening."],"visit_note":"Free with no ticket, open daily 9 AM to 5 PM with airport-style screening and no restrooms inside; lines are shortest early morning, and the bell can be seen through the glass at the south end of the building even when the center is closed.","image_query":"Liberty Bell Philadelphia Liberty Bell Center with Independence Hall behind","sources":["https://www.nps.gov/inde/learn/historyculture/stories-libertybell.htm","https://en.wikipedia.org/wiki/Liberty_Bell","https://www.bcj.com/legacy-projects/liberty-bell-center/","https://www.nps.gov/inde/planyourvisit/libertybellcenter.htm"],"type":"place","body":"The Pennsylvania Assembly ordered the bell from London's Whitechapel Foundry in 1751; it cracked on its first test ring, so Philadelphia metalworkers John Pass and John Stow melted it down and recast it in 1753. The bronze bell weighs about 2,080 pounds and carries a verse from Leviticus: 'Proclaim Liberty throughout all the land unto all the inhabitants thereof.' It hung in the State House tower and rang for public announcements for decades. The famous crack probably opened in the early 1840s; a repair attempt in 1846, before Washington's Birthday, widened it, and the bell has not rung freely since. Abolitionists gave it the name Liberty Bell in 1835. Between 1885 and 1915 it toured the country by train, drawing millions. It left Independence Hall in 1976 for a glass pavilion and moved again on October 9, 2003, into the current Liberty Bell Center, a 12,000-square-foot building by Bohlin Cywinski Jackson that frames the bell against Independence Hall.","crumb":"Historic Philadelphia","when":"Wed 9:00 AM"},"christ-church-burial-ground":{"id":"christ-church-burial-ground","name":"Christ Church Burial Ground","address":"Arch Street and North 5th Street, Philadelphia, PA 19106","one_liner":"Benjamin Franklin's grave, where visitors toss pennies on the stone.","why_it_matters":"A working cemetery kept open as a paid attraction by an active parish: Christ Church earns tour revenue that funds preservation of both the church and the grounds, with about 250,000 visitors a year across its properties. The 2017 gravestone repair is a small lesson in how visitor behavior, in this case coins, becomes a structural load and a drainage problem on historic stone.","fun_facts":["Signs now ask visitors to drop pennies in collection bins rather than on the stone; the church has decided not to ban the tradition.","Four other Declaration signers rest here: Benjamin Rush, Francis Hopkinson, Joseph Hewes and George Ross.","Franklin's grave can be seen for free through the 1858 iron rails at 5th and Arch, even when the gate is closed."],"visit_note":"Open daily 11 AM to 5 PM in October (self-guided $5, guided $10, groups of 10 or more should reserve), and Franklin's grave is visible from the sidewalk if the group only passes by.","image_query":"Benjamin Franklin grave Christ Church Burial Ground pennies","sources":["https://en.wikipedia.org/wiki/Christ_Church_Burial_Ground","https://whyy.org/articles/franklin-will-rest-easier-without-the-penny-cascade","https://christchurchphila.org/visit/"],"type":"place","body":"Christ Church, founded in 1695, opened this burial ground in 1719, and it remains in use today. Five signers of the Declaration of Independence lie here, including the physician Benjamin Rush and, most famously, Benjamin Franklin, who died in 1790 and is buried beside his wife Deborah under a plain flat marble slab. In 1858 the brick wall on Arch Street was opened with iron rails, paid for by people connected to the Franklin Institute, so that passersby could see Franklin's grave without entering. Over time visitors began tossing pennies onto the slab, a nod to Franklin's proverb 'a penny saved is a penny earned.' The weight of the coins and poor drainage cracked the stone; in 2017 the church spent about $80,000 to repair it, raising it slightly and separating it from the graves of Franklin's daughter Sarah and her husband. About 100,000 people visit each year.","crumb":"Historic Philadelphia","when":"Wed 9:00 AM"},"arch-street-meeting-house":{"id":"arch-street-meeting-house","name":"Arch Street Meeting House","address":"320 Arch Street, Philadelphia, PA 19106","one_liner":"Philadelphia's plain Quaker meeting house, built on land Penn gave as a burial ground.","why_it_matters":"Quaker architecture is an early American study in restraint: brick, unornamented benches, no altar, no steeple, light from large windows. It is also a case of a working congregation handing a landmark to a preservation trust in 2011 so that worship, tourism and event rental can coexist under one roof. Penn's Quaker ideals of conscience and equality shaped the tolerant, commercial culture of the city.","fun_facts":["Burials on this site began as early as 1683, about 120 years before the meeting house was built over them.","On Saturday October 17, 2026, it hosts a free '52 Weeks of Firsts' festival marking the 1775 founding of the US Navy and Marine Corps.","The Free Quakers, who broke away to support the Revolution, built their own meeting house one block west at Fifth and Arch; it still stands."],"visit_note":"Open to visitors Thursday to Sunday 10 AM to 4 PM, so on a Tuesday or Wednesday the group sees the exterior and grounds (open daily 9 AM to dusk) unless a private group tour is arranged in advance.","image_query":"Arch Street Friends Meeting House Philadelphia brick exterior","sources":["https://en.wikipedia.org/wiki/Arch_Street_Friends_Meeting_House","https://www.archstreetfriends.org/history/","https://www.historicasmh.org/","https://www.visitphilly.com/52-weeks-of-firsts/"],"type":"place","body":"William Penn deeded this ground to the Religious Society of Friends, the Quakers, in 1701 for use as a burial ground; burials had begun as early as 1683. Master carpenter Owen Biddle built the central block and east wing between 1803 and 1805, following Quaker ideals of plainness and simplicity rather than the fashionable classical style of the day; the west wing followed in 1810 and 1811. The project was financed by selling the Greater Meeting House at Second and Market Streets, a Quaker site since 1696. The building was designed to hold the men's and women's Yearly Meetings, the annual gatherings of Quakers from the whole region, and Philadelphia Yearly Meeting still holds business sessions in the West Room. A monthly meeting worships here every Sunday. The building was listed on the National Register of Historic Places in 1971 and named a National Historic Landmark in 2011, when a preservation trust was formed to maintain it.","crumb":"Historic Philadelphia","flag":"To confirm: open to visitors Thursday to Sunday only. Wednesday is exterior unless a private tour is arranged.","when":"Wed 9:00 AM"},"elfreths-alley":{"id":"elfreths-alley","name":"Elfreth's Alley","address":"124-126 Elfreth's Alley (museum houses), Philadelphia, PA 19106","one_liner":"Thirty-two brick houses on one of America's oldest continuously inhabited streets.","why_it_matters":"A dense, narrow, mixed-income residential street from before the automobile, still lived in, is rare in the US and resonates with Japanese machiya preservation. The alley also shows a light-touch model: residents own and maintain the houses, a small nonprofit runs the museum and events, and the city gains a tourism asset without owning anything.","fun_facts":["The whole alley covers only about 40,000 square feet; the two original owners gave strips of just 5 and 10 feet of land to create it.","Fete Day in early June, when residents open their homes to the public, has been held for more than seventy years.","More than 300,000 people visit each year, yet all but two of the 32 houses are private residences."],"visit_note":"The street is public and open at any hour; the museum houses open only Friday to Sunday 12 to 4 PM, so on a Tuesday or Wednesday walk the group views the exteriors (an immersive theater piece, 'Anvil of the World,' plays in the alley at 6:30 PM on October 22).","image_query":"Elfreth's Alley Philadelphia cobblestone street brick rowhouses","sources":["https://en.wikipedia.org/wiki/Elfreth%27s_Alley","https://www.elfrethsalley.org/"],"type":"place","body":"Elfreth's Alley began around 1703 as a cart path that two landowners, Arthur Wells and John Gilbert, opened between their properties to reach the Delaware River waterfront. By about 1750 it carried the name of Jeremiah Elfreth, a blacksmith and land developer. The 32 narrow brick houses were built between 1720 and 1836 for artisans and tradespeople: shipwrights, pewter and silver smiths, glassblowers, furniture makers. In the 1770s a third of the households were headed by women. The street survived as working-class housing while the blocks around it turned into warehouses, and residents formed the Elfreth's Alley Association in 1934 to protect it. It was named a National Historic Landmark in 1960. Two houses, numbers 124 and 126, are run as a museum preserving the 18th-century home of two dressmakers; the rest are private homes, and more than 300,000 visitors a year walk the cobbles.","crumb":"Historic Philadelphia","when":"Wed 11:30 AM"},"christ-church":{"id":"christ-church","name":"Christ Church","address":"20 North American Street (2nd Street above Market), Philadelphia, PA 19106","one_liner":"The Georgian church where Washington and Franklin worshipped; America's tallest until 1810.","why_it_matters":"The steeple has leaned about two feet for generations. A 2019 to 2020 restoration added steel reinforcement to stop further movement rather than try to straighten it, a decision to accept and stabilize deformation instead of fighting it. The work was funded partly by a $250,000 National Fund for Sacred Places grant matched by more than $500,000 raised by the congregation, a model of blended heritage finance.","fun_facts":["Restorers in 2019 found carved initials and dates in the tower timbers, including 'W.W. 1797' on a wooden ladder.","A fire destroyed the spire in 1908; it was rebuilt, and in 2019 the gilded miter and 50-pound weather vane on top were restored and reinstalled.","Two Declaration signers, Robert Morris and James Wilson, are buried in the church or its adjacent yard."],"visit_note":"Open daily 11 AM to 5 PM with 20 to 30 minute talks (self-guided $5, guided $10); it faces Neighborhood House across American Street, so the group can step inside before or after Wednesday lunch.","image_query":"Christ Church Philadelphia white steeple Georgian church","sources":["https://christchurchphila.org/history/","https://en.wikipedia.org/wiki/Christ_Church_(Philadelphia)","https://whyy.org/articles/philadelphias-christ-church-preserves-historic-steeple","https://www.fundforsacredplaces.org/?p=19966"],"type":"place","body":"Christ Church was founded in 1695 as the Church of England parish in Penn's Quaker city. The present brick building, its main body built between 1727 and 1744, is considered one of the finest Georgian churches in America. The 196-foot steeple, designed by Scottish-born architect Robert Smith and completed in 1754, was financed by a lottery organized by Benjamin Franklin and made the church the tallest structure in North America for 56 years. George Washington, John Adams, Franklin, Betsy Ross, Robert Morris and Benjamin Rush worshipped here; brass plaques mark their pews. In 1785 the rector William White became the first Presiding Bishop of the new American Episcopal Church, and its first General Convention met here in 1789. Absalom Jones, born enslaved to a church vestryman, was later ordained in this parish as the first African American Episcopal priest. The parish is still active and draws about 250,000 visitors a year.","crumb":"Historic Philadelphia","when":"Wed 11:30 AM"},"christ-church-neighborhood-house":{"id":"christ-church-neighborhood-house","name":"Christ Church Neighborhood House","address":"20 North American Street, Philadelphia, PA 19106","one_liner":"A 1915 parish settlement house, now an arts venue; Wednesday lunch and startup showcase.","why_it_matters":"A clean adaptive reuse: a 24,000-square-foot concrete, masonry and steel social-service building converted to a cultural venue without losing its character. Structural engineer Keast & Hood underpinned the basement to insert an elevator, built a link to the adjacent Washburn House and created a gated plaza over underground crypts; the project won a 2011 Grand Jury Award from the Preservation Alliance for Greater Philadelphia. The venue now serves more than 50 artists and ensembles a year.","fun_facts":["A 1933 bathtub in the building carries a plumber's note: 'This work kept two men from starving.'","The Great Hall, where the group eats and presents, is 1,700 square feet with original poured-pane glass windows and seats about 100 at tables.","The fourth-floor theater still has the basketball hoops from the settlement-house gym."],"visit_note":"Wednesday October 21 lunch and startup presentations are in the Great Hall, a floor below the fourth-floor theater; it is not air conditioned (fine in late October), the wheelchair-accessible entrance is from 2nd Street, and the church and garden across the street are available for a short break.","image_query":"Christ Church Neighborhood House Philadelphia Great Hall interior","sources":["https://www.philadelphiacongregations.org/records/item/ChristChurch.SocialSurvey1915","https://www.inquirer.com/philly/news/local/20100602_Christ_Church_to_open_new_arts_venue.html","https://www.neighborhood-house.com/our-spaces","https://keasthood.com/projects/christ-church-neighborhood-house"],"type":"place","body":"Christ Church built Neighborhood House between about 1911 and 1915 under its rector, the Reverend Louis Cope Washburn, who arrived in 1907 and argued that the parish needed a separate building to serve the poor immigrant district around it and to act as a fire barrier protecting the 1744 church. It cost about $70,000, and the last of the building debt was paid in April 1915. It ran as a settlement house: a lunch room for working women, a sewing workshop for the unemployed, milk distribution, a boys' club with a summer camp, a top-floor gymnasium and a soup kitchen that was especially busy during the Depression. A 1915 door-to-door survey by the congregation counted 62,457 people living or working in the parish. A $4 million renovation completed in 2010 turned the fourth-floor gym into a 200-seat black-box theater and made the building a performance and community venue run by the Christ Church Preservation Trust.","crumb":"Hotel, dining and venues","when":"Wed 12:15 PM"},"rittenhouse-square":{"id":"rittenhouse-square","name":"Rittenhouse Square","address":"18th and Walnut Streets, Philadelphia, PA 19103","one_liner":"Penn's Southwest Square, redesigned by Paul Cret in 1913, the city's premier address.","why_it_matters":"Jane Jacobs used the four residential squares in 'The Death and Life of Great American Cities' (1961) to argue that identical parks have 'wildly different' fates depending on the mix of uses around them; Rittenhouse, ringed by apartments, offices, shops, a music conservatory and churches, was her success story. It remains the city's highest-value residential ring, with postwar towers replacing most of the Victorian mansions, and is maintained by a private friends group rather than the city.","fun_facts":["The bronze goat 'Billy' by Albert Laessle, installed in 1919, has been polished bright by generations of climbing children.","The lion in the central plaza is Antoine-Louis Barye's 'Lion Crushing a Serpent,' cast in 1890; Paul Manship's 'Duck Girl' (1911) stands in the pool.","The first house on the square, built by brick manufacturer James Harper at 1811 Walnut Street, later became the Rittenhouse Club."],"visit_note":"Monday October 19 walking tour: an open public park with no hours risk, and Stotesbury Mansion at 1923 Walnut Street, the Wednesday dinner venue, is a two-minute walk west along Walnut.","image_query":"Rittenhouse Square Philadelphia park central plaza autumn","sources":["https://tclf.org/landscapes/rittenhouse-square","https://en.wikipedia.org/wiki/Rittenhouse_Square","https://www.phillymag.com/news/2016/01/08/philadelphia-public-squares-william-penn","https://whyy.org/articles/jane-jacobs-and-philly-s-four-original-squares/"],"type":"place","body":"Rittenhouse Square is the southwest of the five public squares in William Penn's 1682 plan, and the only one never used as a burial ground. For its first century it was woodland used by hunters, then pasture ringed by brickyards and kilns. Residents fenced it with rough boards in 1816, the first mansion rose on its edge in 1840, and in 1853 an iron fence and three fountains were added. It was renamed in 1825 for David Rittenhouse, the astronomer, clockmaker and patriot. In 1913 the Rittenhouse Square Improvement Association hired French-born architect Paul Philippe Cret, to lay out the six-acre park much as it looks today: diagonal walks from the corners meeting at an oval central plaza with a reflecting pool, stone balustrades, urns and classical entrances evoking a Parisian garden. In the 1950s residents defeated a plan for an underground parking garage beneath it. The nonprofit Friends of Rittenhouse Square now maintains the park.","crumb":"Historic Philadelphia","when":"Mon"},"rail-park":{"id":"rail-park","name":"The Rail Park","address":"1300 Noble Street (Broad and Noble entrance), Philadelphia, PA 19123","one_liner":"A quarter-mile elevated park on an 1890s rail viaduct, with two more miles planned.","why_it_matters":"A direct comparison to the High Line, but wider and eventually about twice as long. The hard part now is land and remediation: Phase 2 estimates run from about $75 million for a base trail to $149 million for a full build, and Reading International, which still owns the viaduct, asked $25 million while an appraisal valued it at zero net of cleanup. About 20 percent of homes around the viaduct are long-term affordable.","fun_facts":["The swings on Phase 1 hang from the viaduct's structural steel, and a Cor-ten steel 'history wall' lists the factories that once lined the line.","Ownership of Phase 1 passed from SEPTA, the transit agency, to the City; Parks & Recreation maintains it and Friends of the Rail Park runs programming.","Basic maintenance of the finished Phase 2 is estimated at $2.5 million a year, a reminder that parks are operating businesses."],"visit_note":"Tuesday October 20: the group walks the park between 1314 Spring Garden Street and the Wanamaker Building; it is free and open daily 7 AM to 10 PM, with a ramp at the Noble Street entrance (1300 Noble) and stairs at Callowhill Street between 11th and 12th.","image_query":"Rail Park Philadelphia elevated park swings viaduct Callowhill","sources":["https://www.phillymag.com/2018/06/14/philadelphia-rail-park-open/","https://www.archpaper.com/2018/06/philadelphia-first-phase-high-line/","https://centercityphila.org/uploads/attachments/cmnt581470i6h27qduttxeqrq-bid-class-rail-park-2026-04-09.pdf","https://www.therailpark.org/visit"],"type":"place","body":"The Reading Railroad built the viaduct in the 1890s to carry passenger and freight trains above the streets north of Center City into Reading Terminal. The last train ran in 1984, and the structure sat abandoned for decades while the Callowhill neighborhood around it lost its factories. Inspired by New York's High Line, neighbors formed Friends of the Rail Park, and the Center City District led the first phase. Designed by landscape architects Studio Bryan Hanes, the quarter-mile Phase 1 from 13th and Noble Streets to Callowhill Street opened on June 14, 2018, at a cost of about $10.8 million, with native planting, embedded rail remnants, riveted I-beams reused as benches and large industrial swings. Phase 2, the Viaduct Greenway from Vine Street to Fairmount Avenue, covers 6.8 acres over about six-tenths of a mile; bid documents are targeted for fall 2026 and construction for 2027 to 2028. The full vision is roughly three miles.","crumb":"Sites on the tour","when":"Tue 10:45 AM"},"reading-terminal-market":{"id":"reading-terminal-market","name":"Reading Terminal Market","address":"1136 Arch Street (12th and Arch), Philadelphia, PA 19107","one_liner":"America's great public food hall, under an 1893 railroad train shed since opening day.","why_it_matters":"A public market saved by public ownership, nonprofit management and a convention center built on top of it: the 1893 train shed overhead is now the Convention Center's Grand Hall. Pennsylvania Dutch (Amish and Mennonite) farmers from Lancaster County were recruited in the 1980s and anchor the market's authenticity. Few places anywhere put a 19th-century rail structure, a convention center and 80 small businesses under one roof.","fun_facts":["Bassetts Ice Cream, founded in 1861, has sold here since opening day in 1893 and is America's oldest continuously operating ice cream company.","DiNic's roast pork sandwich (pork, sharp provolone, broccoli rabe) was named 'Best Sandwich in America' by the Travel Channel in 2013; the stall opened in 1980.","Hershel's East Side Deli cures its pastrami in the market basement; on one Flower Show day in 2018 it went through nearly 1,500 pounds of meat."],"visit_note":"Tuesday October 20 lunch: open daily 8 AM to 6 PM, with the lunch rush roughly 11:30 to 1:30 and tight seating for 30; recommended stalls are Hershel's East Side Deli (hand-carved pastrami on rye, open daily) and DiNic's (roast pork, Monday to Saturday), plus Beiler's doughnuts, Bassetts ice cream and Dutch Eating Place (apple dumplings, Tuesday 8 AM to 3 PM); some Amish stalls close Sunday and Monday and a few are cash-only.","image_query":"Reading Terminal Market Philadelphia interior crowd neon signs","sources":["https://readingterminalmarket.org/about/history/","https://en.wikipedia.org/wiki/Reading_Terminal","https://readingterminalmarket.org/merchant/dinics/","https://whyy.org/articles/hershels-east-side-deli-record-breaking-breakfasts-longtime-traditions"],"type":"place","body":"When the Philadelphia and Reading Railroad bought the 1100 block of Market Street in 1890 for a new terminal, the farmers' markets already on the site refused to leave, so the railroad built its market beneath the elevated tracks. The market opened on February 22, 1893, with nearly 800 stalls and a 52-room cold-storage basement, under a train shed by Wilson Brothers & Company that was one of the largest single-span arched roofs in the world and is now the only one of its kind left in the United States; Francis Kimball designed the head house on Market Street. The railroad went bankrupt in 1971, the last train left on November 6, 1984, and the market nearly died. The Pennsylvania Convention Center Authority bought it in 1990 with about $30 million in public funds for renovation, and a nonprofit corporation has run it since the mid-1990s. More than 80 merchants now draw roughly 100,000 visitors a week.","crumb":"Historic Philadelphia","when":"Tue 12:30 PM"},"wanamaker-building":{"id":"wanamaker-building","name":"Wanamaker Building","address":"1300 Market Street, Philadelphia, PA 19107","one_liner":"Burnham's 1911 department-store palace, now a 622-unit office-to-residential conversion.","why_it_matters":"The largest adaptive reuse underway in Philadelphia: 1.4 million square feet with a roughly 100,000-square-foot floor plate, far deeper than conversion rules of thumb allow. Rather than cutting new light wells, the team is restoring a rooftop skylight and removing a ninth-floor courtyard to bring daylight into the core, while keeping offices on floors four and five, retail on the lower floors and the Grand Court and organ open to the public.","fun_facts":["The organ and the eagle are protected by the Philadelphia Historical Commission; the organ, itself a National Historic Landmark, cannot be removed or moved.","Office occupancy upstairs fell from 96 percent in 2017 to 21 percent by 2023, when the upper floors entered bankruptcy.","Finley Catering, operator of the ninth-floor Crystal Tea Room, signed a 29-year lease in May 2026 and is adding a $4 million event room opening early 2027."],"visit_note":"Tuesday October 20, 11:00 AM, a private tour with Alterra; construction was slated to start in early 2026 and run about two years, so expect site conditions and confirm access to the Grand Court and organ in advance, since the holiday light show and public programming are paused during the work.","image_query":"Wanamaker Building Grand Court organ eagle Philadelphia","sources":["https://www.bisnow.com/news/philadelphia/adaptive-reuse/tf-cornerstone-owns-wanamaker-building-office-to-resi-retail-129648","https://www.phillyvoice.com/wanamaker-building-plans-rooftop-pool-retail-apartments/","https://philadelphia.today/2026/10/finley-catering-wanamaker-building-event-venue/","https://en.wikipedia.org/wiki/John_Wanamaker_Store"],"type":"place","body":"John Wanamaker opened his first store on this site in 1876 and replaced it with a 12-story palace designed by Chicago architect Daniel H. Burnham; President William Howard Taft dedicated it on December 30, 1911. Its marble Grand Court holds the Wanamaker Organ, built for the 1904 St. Louis World's Fair and first played here on June 22, 1911; with roughly 28,750 pipes it is the largest fully operational pipe organ in the world. A 2,500-pound bronze eagle by August Gaul, also from the 1904 fair, gave Philadelphians their meeting place: 'Meet me at the Eagle.' The building became a National Historic Landmark in 1978. Macy's took over the store in 2006 and closed it on March 23, 2025. New York developer TF Cornerstone, which bought the retail floors in 2019, won the upper office floors at a June 2025 bankruptcy auction and, with local partner Alterra Property Group, is converting the top six floors into 622 loft apartments.","crumb":"Sites on the tour","related":["alterra"],"when":"Tue 11:00 AM"},"stotesbury-mansion":{"id":"stotesbury-mansion","name":"Stotesbury Mansion","address":"1923 Walnut Street, Philadelphia, PA 19103","one_liner":"The last of the Rittenhouse Square mansions, a banker's townhouse turned ballroom venue.","why_it_matters":"Almost every mansion that lined Walnut Street west of the square was demolished or gutted for apartments and storefronts in the 20th century; this one survived because a private club bought it in 1926 and has used event income to keep it intact. It is a compact example of a social club, rather than a museum or the state, carrying the cost of a landmark.","fun_facts":["During Prohibition the club built a mirrored wall and ceiling to hide its liquor store from federal agents; the mirror maze is now a favorite photo backdrop.","General Douglas MacArthur courted his first wife, Stotesbury's stepdaughter Louise Cromwell, in the parlor here.","The PBS arts series 'Articulate' is filmed in the former squash court on the upper floors."],"visit_note":"Wednesday October 21 closing dinner is here; the ballroom is on an upper floor reached by stairs or a vintage elevator, and the house is a short walk from Rittenhouse Square and the Monday tour route.","image_query":"Stotesbury Mansion 1923 Walnut Street Philadelphia ballroom","sources":["https://whyy.org/articles/look-comings-and-goings-early-rittenhouse-row/","https://billypenn.com/?p=168729","https://en.wikipedia.org/wiki/Edward_T._Stotesbury"],"type":"place","body":"The five-story Jacobean-style house at 1923 Walnut Street was designed by Cope & Stewardson for Thomas McKean Jr. in 1897, replacing an earlier house on the site by the firm of Frank Furness. In 1910 it was bought by Edward T. Stotesbury (1849 to 1938), a partner in Drexel & Co. and J.P. Morgan & Co., with a fortune estimated at $100 million in 1927. He and his wife Eva remodeled it lavishly, with a Georgian ballroom hung with Venetian chandeliers, a 'fiddler's booth' for musicians above the ballroom doors, a billiards room and a squash court. This was their city house; their main residence, Whitemarsh Hall, a vast Horace Trumbauer palace built outside the city between 1916 and 1921, was demolished in 1980. Since 1926 the Walnut Street house has belonged to the Catholic Philopatrian Literary Institute, a club founded by Irish Catholic immigrants in 1850, which rents it for weddings, banquets and conferences.","crumb":"Hotel, dining and venues","when":"Wed 5:30 PM"},"carpenters-hall":{"id":"carpenters-hall","name":"Carpenters' Hall","address":"320 Chestnut Street, Philadelphia, PA 19106","one_liner":"A builders' guild hall where the First Continental Congress met in 1774.","why_it_matters":"The direct ancestor of the general contractor: the Carpenters' Company set building standards and prices in colonial Philadelphia, and its members designed and built many of the city's early landmarks. The hall is still owned by the guild, not the government, and a $3 million exterior preservation project plus a Christmas Eve 2022 arson fire in the basement show the burden a small private owner carries inside a national park.","fun_facts":["The hall closed in April 2022 for preservation work and reopened July 3, 2023; the fire damaged archives and mechanical systems but not the structure.","Robert Smith, the hall's architect, also designed the steeple of Christ Church two blocks away.","A Company member, Isaac Davis, was found guilty in the 1798 robbery along with the bank's porter and was expelled from the guild."],"visit_note":"Open Tuesday to Sunday 10 AM to 4 PM, free, closed Mondays; it sits in a quiet courtyard off Chestnut Street between 3rd and 4th, two minutes from Independence Hall, and the group can walk in without tickets on the Wednesday tour.","image_query":"Carpenters' Hall Philadelphia brick Georgian facade courtyard","sources":["https://www.carpentershall.org/history","https://www.phillyvoice.com/carpenters-hall-reopening-preservation-project-fire-arson-christmas-eve-independence-national-historical-park/","https://home.nps.gov/inde/planyourvisit/hours.htm/index.htm"],"type":"place","body":"The Carpenters' Company of the City and County of Philadelphia, founded in 1724 and the oldest craft guild still operating in America, bought this lot in 1768 and began its hall in 1770 to a design by member Robert Smith, the architect of Christ Church's steeple. The Company met inside from 1771 while work continued. In September 1774 the First Continental Congress chose this private tradesmen's building over the government's State House to list its grievances against Britain. Benjamin Franklin's Library Company rented the second floor, the First Bank of the United States leased the ground floor in the 1790s, and in 1798 the Bank of Pennsylvania, then a tenant, suffered America's first bank robbery, about $162,000 taken during a yellow fever epidemic. In 1857 the Company restored the hall and opened it free to the public, the first privately owned American building run as a historic monument. The Company still owns and operates it.","crumb":"Historic Philadelphia","flag":"On the Long Form tab but not the Clean tab. Keep or cut."},"philly250":{"id":"philly250","name":"Philadelphia and Philly250","address":"Center City, Philadelphia, PA (City Hall, 1400 John F. Kennedy Boulevard, Philadelphia, PA 19107)","one_liner":"The planned city where the United States was founded, turning 250 in 2026.","why_it_matters":"Three reasons the city matters to construction tech. It leads the US in growth of office-to-residential conversion activity: about 2 million square feet of Center City offices are slated for conversion, the pipeline grew 119 percent in a year, and the metro ranks seventh nationally. Penn's Amy Gutmann Hall is the city's first mass timber building. And modular manufacturer Volumetric Building Companies is headquartered here, while in January 2026 Mayor Parker proposed a city-backed modular housing factory in North Philadelphia.","fun_facts":["The name is Greek for 'brotherly love,' and Penn's 1682 grid with public squares became the model for American city planning.","Independence National Historical Park normally draws 3 to 5 million visitors a year; 2026 is expected to set records.","In early 2025 Philadelphia had the lowest office availability of the 15 largest US office markets, at 14.1 percent (CoStar)."],"visit_note":"Expect heavier than usual crowds in the Historic District all year; Independence Hall tickets and Liberty Bell lines are the main pinch points, the restored First Bank of the United States (reopened July 1, 2026) is a new stop on 3rd Street, and the Firstival at 1412 Chestnut Street on Saturday October 24 is the nearest free 250th event for anyone staying the weekend.","image_query":"Philadelphia skyline City Hall William Penn statue Benjamin Franklin Parkway","sources":["https://en.wikipedia.org/wiki/Philadelphia","https://www.visitphilly.com/52-weeks-of-firsts/","https://propmodo.com/playbook/philadelphias-office-conversions-are-reshaping-center-city/","https://www.cityandstatepa.com/policy/2026/01/mayor-cherelle-parker-unveils-plans-modular-housing-factory-north-philadelphia/410842/"],"type":"place","body":"Philadelphia was founded in 1682 by William Penn, an English Quaker, as the capital of his colony of Pennsylvania. Penn and his surveyor Thomas Holme laid it out as a grid between the Delaware and Schuylkill Rivers with five public squares, a plan that still defines Center City. The First Continental Congress met here in 1774, the Declaration of Independence was adopted on July 4, 1776, the Constitution was signed in 1787, and the city was the national capital at several points between 1775 and 1800. About 1.57 million people live here today (2025 estimate), the sixth-largest US city. 2026 is the Semiquincentennial, the 250th anniversary of independence. The city hosted six FIFA World Cup matches and the MLB All-Star Game in summer 2026, and '52 Weeks of Firsts' stages a free festival every Saturday, including October 17 (US Navy and Marine Corps, at Arch Street Meeting House) and October 24 (first public motion-picture showing, 1412 Chestnut Street).","crumb":"About Philadelphia"},"the-bellevue-hotel":{"id":"the-bellevue-hotel","name":"The Bellevue Hotel","category":"hotel","address":"200 S. Broad St., Philadelphia, PA 19102","one_liner":"Philadelphia's 1904 Grande Dame of Broad Street, reborn as hotel, homes and club.","why_it_matters":"One 1904 landmark now stacks a smaller hotel, 155 rental apartments, four office floors and a 100,000 sq ft private club: a live case of repositioning an aging grand hotel by cutting keys and adding residential, the same mixed-use arithmetic behind many Tokyo heritage-building projects. The restoration also removed a 1990s mall escalator and food court from the lobby, reversing an earlier round of value engineering.","fun_facts":["Chicken a la King is credited to cook William King at George Boldt's earlier Bellevue hotel in the 1890s.","The hotel's original Thomas Edison electric panel was restored and is on display after the 2024 reopening.","Fifteen U.S. presidents stayed here, from Theodore Roosevelt to Ronald Reagan; JFK spoke at a dinner here on October 30, 1963."],"visit_note":"Summit base hotel Monday to Thursday; the Tuesday 8 AM breakfast is in XIX, the 19th-floor event rooms (the former Pearl Room, Cameo Room and Rose Garden), while the 19th-floor all-day restaurant is now called Pergola (weekday breakfast 6:30 to 11 AM).","image_query":"Bellevue Hotel Philadelphia Broad Street facade","sources":["https://en.wikipedia.org/wiki/The_Bellevue-Stratford_Hotel","https://www.inquirer.com/columnists/park-hyatt-bellevue-renovations-20250428.html","https://www.hospitalitynet.org/announcement/41011820/the-bellevue-philadelphias-grande-dame-hotel-reawakens-after-120-years","https://www.hotelmanagement.net/renovations/historic-bellevue-hotel-reopens-philadelphia-following-major-revitalization"],"type":"place","body":"The Bellevue-Stratford opened in 1904, designed in French Renaissance style by the brothers G.W. and W.D. Hewitt for hotelier George Boldt, with lighting fixtures designed by Thomas Edison. It was called the most luxurious hotel in the country and hosted fifteen U.S. presidents. In July 1976 an American Legion convention here became the first recognized outbreak of Legionnaires' disease: 29 people died, the bacterium was traced to the cooling towers, and the hotel closed that November. It reopened in 1989 as the Hotel Atop the Bellevue, became the Park Hyatt in 1996 and joined Hyatt's Unbound Collection in 2018. Lubert-Adler bought the building in 2021 and spent three years restoring it; the hotel reopened in November 2024 as The Bellevue Hotel, still flagged under The Unbound Collection by Hyatt, with 184 guestrooms including 39 suites, 155 rental apartments on seven floors, four office floors, five ballrooms and the 100,000 sq ft Sporting Club.","crumb":"Hotel, dining and venues","flag":"To confirm: the 19th-floor restaurant is now called Pergola; XIX is the event-room name. Label the breakfast venue once confirmed.","when":"Mon"},"skyhigh-four-seasons":{"id":"skyhigh-four-seasons","name":"SkyHigh at the Four Seasons Hotel Philadelphia","category":"bar","address":"1 N. 19th St., 60th floor, Philadelphia, PA 19103","one_liner":"Cocktails on the 60th floor of Philadelphia's tallest tower.","why_it_matters":"The tower is a vertically stacked mixed-use program (television studios, a corporate campus, a hotel) on a tight Center City site, and its structure relies on five tuned sloshing dampers holding 125,000 gallons of water in the 57th-floor ceiling to control sway. It is also the cost benchmark against which Philadelphia's far cheaper modular and conversion projects are measured.","fun_facts":["Five tuned sloshing dampers holding 125,000 gallons of water sit in the 57th-floor ceiling to reduce wind sway.","NBC10 and Telemundo62 moved their studios from City Avenue into the tower's lower floors.","Four Seasons describes it as the highest hotel in the United States, with the lobby and restaurant on the 60th floor."],"visit_note":"Optional Monday, Oct 19 at 8 PM for arrival drinks; live music Monday 6 to 8 PM; no dress code is published.","image_query":"SkyHigh Four Seasons Philadelphia 60th floor lounge view","sources":["https://press.fourseasons.com/philadelphia/hotel-facts","https://en.wikipedia.org/wiki/Comcast_Technology_Center","https://www.visitphilly.com/places-to-stay/hotels/four-seasons-hotel-philadelphia-at-comcast-center/"],"type":"place","body":"SkyHigh is the sky-lobby lounge of the Four Seasons Hotel Philadelphia at Comcast Center, serving Jean-Georges Vongerichten's cocktails and shareable plates from the 60th floor; his formal restaurant, Jean-Georges Philadelphia, is one floor below. The hotel, opened in August 2019, occupies the top 12 floors of the Comcast Technology Center, a 60-story, 1,121-foot (342 m) tower designed by Foster + Partners and developed by Liberty Property Trust for about $1.5 billion. The tower opened to the public in October 2018 and is the tallest building in Philadelphia and Pennsylvania, and the tallest in the Western Hemisphere outside Manhattan and Chicago. The hotel has 227 rooms and suites, a 30,000-gallon infinity pool on the 57th floor, and Vernick Fish by James Beard winner Greg Vernick at street level. Walk-ins are accepted at the bar subject to availability.","crumb":"Hotel, dining and venues","when":"Mon 8:00 PM"},"her-place-supper-club":{"id":"her-place-supper-club","name":"Her Place Supper Club","category":"restaurant","address":"1740 Sansom St., Philadelphia, PA 19103","one_liner":"Michelin-starred weeknight supper club where the chef narrates every course.","why_it_matters":"Beyond the food, the business model is worth noting: a 24-seat room, prepaid reservations, weekday-only service and staff benefits such as paid vacation stipends and health-insurance support, all inside a converted small storefront. It shows how high-value hospitality can fill ground-floor retail space that larger tenants have abandoned.","fun_facts":["Dinner cost $65 per person when it opened; by 2023 it was $90.","Shulman describes her cooking as 'fake simple': food that tastes simple even when the technique is not.","Guests are encouraged to introduce themselves to the next table."],"visit_note":"Tuesday, Oct 20 at 5 PM, welcome dinner with a full buyout of the room; dress is casual.","image_query":"Her Place Supper Club Philadelphia dining room Amanda Shulman","sources":["https://guide.michelin.com/us/en/pennsylvania/philadelphia/restaurant/her-place-supper-club","https://thepenngazette.com/fake-simple/","https://www.phillyvoice.com/her-place-supper-club-amanda-shulman-food-wine-best-new-chefs/","https://www.inquirer.com/food/james-beard-wins-2026-philadelphia-20260615.html"],"type":"place","body":"Her Place began in 2021 as a pop-up in a former pizza shop on Sansom Street, funded with about $15,000 of chef-owner Amanda Shulman's savings, and became one of Philadelphia's most sought-after tables. Shulman, a Penn graduate, trained at Vetri Cucina, Momofuku Ko and Joe Beef in Montreal. The format is a communal dinner party: two seatings a night of 24 guests, a fixed multi-course menu with French and Italian accents that changes every two weeks, and every dish introduced to the room before it is served. In November 2025 it earned one of Philadelphia's first three Michelin stars. Shulman was a James Beard Emerging Chef finalist in 2023 and a Best Chef: Mid-Atlantic finalist in 2025 and 2026, a Food & Wine Best New Chef in 2023, and Philadelphia magazine named Her Place best new restaurant of 2022. Open weeknights only; her second restaurant, My Loup, is on Walnut Street.","crumb":"Hotel, dining and venues","when":"Tue 5:00 PM"},"parc":{"id":"parc","name":"Parc","category":"restaurant","address":"227 S. 18th St., Philadelphia, PA 19103","one_liner":"Stephen Starr's Paris brasserie on Rittenhouse Square, open all day.","why_it_matters":"Starr said the corner 'was asleep for years' before Parc; the restaurant served about 1,000 meals a day in its first weeks and is a textbook example of one ground-floor tenant resetting a park-front block.","fun_facts":["Parc served about 1,000 meals a day in its first weeks, with 45-minute waits for sidewalk tables.","The interior seats 210; the sidewalk seats 80."],"visit_note":"Monday Oct 19 'at leisure' dinner option, a five-minute walk from The Bellevue; book ahead or walk in for the bar and sidewalk tables.","image_query":"Parc restaurant Rittenhouse Square sidewalk cafe","sources":["https://www.inquirer.com/philly/food/restaurants/20080725_New_Starr_shines_on_the_square.html","https://www.theinfatuation.com/philadelphia/reviews/parc-brasserie","https://www.jamesbeard.org/stories/the-2017-james-beard-award-winners"],"type":"place","body":"Stephen Starr's Paris-style brasserie opened in J
