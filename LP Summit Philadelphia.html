onal Managing Director, Pennsylvania","organization":"Brandywine Realty Trust","company_id":"brandywine","presenting_slot":"Thursday, October 22, 11:00 AM: Schuylkill Yards tour, ending at Cira Centre","photo_query":"Jeffrey DeVuono Brandywine Realty Trust","sources":["https://www.brandywinerealty.com/leadership/h-jeffrey-devuono"],"type":"person","body":"H. Jeffrey DeVuono is executive vice president and senior managing director of Brandywine's life science division and regional managing director for its Pennsylvania portfolio, which includes University City and Schuylkill Yards. He joined Brandywine in January 1997 after asset management roles at developer LCOR and began his career in sales and leasing at Cushman & Wakefield in Philadelphia. He serves on the boards of the Center City District, the University City District and the King of Prussia District, where he is a former chairman, and is a member of the Wharton School's Zell/Lurie Real Estate Center, NAIOP and NAREIT. His education is not published on Brandywine's site.","crumb":"People","profile":"https://www.brandywinerealty.com/leadership/h-jeffrey-devuono","sub":"Executive Vice President and Senior Managing Director, Life Science; Regional Managing Director, Pennsylvania, Brandywine Realty Trust","flag":"To confirm: possible presenter; not named in the schedule","when":"Thu 11:00 AM"},"mayva-donnon":{"id":"mayva-donnon","name":"Mayva Donnon","title":"Partner, AIA, NCARB","organization":"KSS Architects","company_id":"kss-architects","presenting_slot":"Thursday, October 22, 10:00 AM: Amy Gutmann Hall tour","photo_query":"Mayva Donnon KSS Architects partner","sources":["https://kssarchitects.com/node/453","https://philadelphia.uli.org/meet-the-next-flight-2023/","https://dev.kssarchitects.com/journal/kss-architects-partner-mayva-donnon-inducted-into-the-carpenters’-company/"],"type":"person","body":"Mayva Donnon, AIA, NCARB, is a partner at KSS Architects, where she has worked for more than 15 years and is a function fmtTime(hhmm) {
  if (!hhmm) return '';
  if (lang === 'ja') return hhmm;
  let [h, m] = hhmm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}
const find = id => DATA.index[id];
const mapLinks = addr => { const q = encodeURIComponent(addr); return `<a href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener">${ICON.map}${ui('map')}</a> <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${ICON.ext}${ui('google')}</a>`; };

function applyUI() {
  document.documentElement.setAttribute('lang', lang);
  document.querySelectorAll('[data-ui]').forEach(el => { el.textContent = ui(el.dataset.ui); });
  $('#lang-en').setAttribute('aria-pressed', lang === 'en'); $('#lang-ja').setAttribute('aria-pressed', lang === 'ja');
  $('#ja-banner').hidden = lang !== 'ja';
}

function renderSchedule() {
  const ny = nyParts();
  const chips = $('#day-chips'); chips.innerHTML = '';
  DATA.days.forEach(d => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', d.id === dayId);
    const dayShort = lang === 'ja' ? t(d.weekday).replace(/^(\d+月\d+日).*$/, '$1') : t(d.weekday).replace(/^(\w{3})\w*, (\w{3})\w* (\d+)$/, '$2 $3');
    b.innerHTML = `${d.date === ny.date ? `<span class="today">${ui('today')}</span>` : ''}<span>${esc(t(d.label))}</span><small>${esc(dayShort)}</small>`;
    b.onclick = () => { dayId = d.id; store.set('day', dayId); renderSchedule(); };
    chips.appendChild(b);
  });
  const d = DATA.days.find(x => x.id === dayId) || DATA.days[0];
  let nowIdx = -1, nextIdx = -1;
  if (d.date === ny.date) {
    d.items.forEach((it, i) => { if (it.time && toMins(it.time) <= ny.mins) nowIdx = i; });
    nextIdx = d.items.findIndex((it, i) => i > nowIdx && it.time);
  }
  const head = `<div class="dayhead"><div class="eyebrow">${esc(t(d.weekday))}</div><h2 class="display">${esc(t(d.label))}</h2>${d.theme ? `<p class="theme">${esc(t(d.theme))}</p>` : ''}<p><span class="label">${ui('dress')}</span>${esc(t(d.dress))}</p>${d.note ? `<p class="warn">${esc(t(d.note))}</p>` : ''}</div>`;
  const rows = d.items.map((it, i) => {
    const state = i === nowIdx ? `<span class="state">${ui('now')}</span>` : (i === nextIdx ? `<span class="state">${ui('next')}</span>` : '');
    const title = it.ref && find(it.ref) ? `<button type="button" data-open="${esc(it.ref)}">${esc(t(it.title))}</button>` : esc(t(it.title));
    const stops = it.stops ? `<div class="stops">${it.stops.map(s => find(s) ? `<button type="button" class="tagbtn" data-open="${esc(s)}">${esc(find(s).name)}</button>` : '').join('')}</div>` : '';
    return `<li class="item${i === nowIdx ? ' now' : ''}${it.kind === 'talk' ? ' talk' : ''}"><div class="time">${esc(fmtTime(it.time))}</div><div class="body"><p class="title">${title}${state}</p>${it.host ? `<p class="host">${ui('host')}: ${esc(t(it.host))}</p>` : ''}${it.detail ? `<p class="detail">${esc(t(it.detail))}</p>` : ''}${stops}</div></li>`;
  }).join('');
  $('#day-body').innerHTML = head + `<ol class="timeline">${rows}</ol>`;
}

function cardList(ids, tagFn) {
  return `<ul class="cards">${ids.map(id => { const e = find(id); if (!e) return ''; const tag = tagFn ? tagFn(e) : '';
    return `<li><button type="button" class="card" data-open="${esc(id)}"><p class="name">${esc(e.name)}</p><p class="sub">${esc(e.sub || t(e.one_liner) || '')}</p>${tag && tag.text ? `<span class="tag${tag.cls ? ' ' + tag.cls : ''}">${esc(tag.text)}</span>` : ''}</button></li>`; }).join('')}</ul>`;
}
function renderPlaces() {
  const g = DATA.groups;
  $('#view-places').innerHTML = `<p class="lede">${ui('pPlaces')}</p><h2 class="section-title display">${ui('gSites')}</h2>${cardList(g.sites, e => ({ text: e.when || '' }))}<h2 class="section-title display">${ui('gHistoric')}</h2>${cardList(g.historic, e => ({ text: e.when || '' }))}<h2 class="section-title display">${ui('gVenues')}</h2>${cardList(g.venues, e => ({ text: e.when || '' }))}`;
}
function renderCompanies() {
  $('#view-companies').innerHTML = `<p class="lede">${ui('pCompanies')}</p>${cardList(DATA.groups.companies, e => ({ text: e.when || '', cls: e.when ? 'talk' : '' }))}`;
}
function renderPeople() {
  $('#view-people').innerHTML = `<p class="lede">${ui('pPeople')}</p>${cardList(DATA.groups.people, e => ({ text: e.when || '' }))}`;
}
function renderEssentials() {
  const E = DATA.essentials; const h = find(E.hotel.ref);
  const contacts = E.contacts.map(c => `<div class="contact"><div class="n">${esc(c.name)}</div><div class="r">${esc(t(c.role))}${c.email ? ` · ${esc(c.email)}` : ''}</div><div class="p${/\[/.test(c.phone) ? ' missing' : ''}">${esc(c.phone)}</div></div>`).join('');
  const tips = E.tips.map(x => `<div class="panel"><h3 class="display">${esc(t(x.h))}</h3><p>${esc(t(x.p))}</p></div>`).join('');
  $('#view-essentials').innerHTML = `
    <div class="driver"><img class="mark" src="${DATA.logos.mark_white}" alt=""><div class="eyebrow on-navy">${ui('driver')}</div><p class="big">${esc(t(E.hotel.driver_card))}</p><p class="addr">${esc(E.hotel.address)}</p><div class="row"><button type="button" class="btn inverse" id="copy-addr">${ICON.copy}<span>${ui('copy')}</span></button><a class="btn inverse" href="https://maps.apple.com/?q=${encodeURIComponent(E.hotel.address)}" target="_blank" rel="noopener">${ICON.map}${ui('map')}</a><a class="btn inverse" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(E.hotel.address)}" target="_blank" rel="noopener">${ICON.ext}${ui('google')}</a></div></div>
    <div class="panel"><h3 class="display">${ui('hotel')}</h3><p><button type="button" class="linkish" data-open="${esc(E.hotel.ref)}">${esc(h ? h.name : E.hotel.name)}</button></p><p class="num" style="font-size:14px">${esc(E.hotel.address)}</p></div>
    <div class="panel"><h3 class="display">${ui('contacts')}</h3>${contacts}</div>
    ${tips}
    <h2 class="section-title display">${ui('dinners')}</h2>${cardList(E.dinner_list, e => ({ text: e.when || '' }))}
    <h2 class="section-title display">${ui('primer')}</h2>${cardList(['philly250'])}
    <h2 class="section-title display" id="review-title">${ui('review')}</h2><div class="panel review"><ol>${DATA.review.map(r => `<li><strong>${esc(r.t)}</strong>${esc(r.d)}</li>`).join('')}</ol></div>`;
  const cb = $('#copy-addr'); if (cb) cb.onclick = () => { const txt = `${t(E.hotel.driver_card)}\n${E.hotel.address}`; const done = () => { cb.innerHTML = `${ICON.check}<span>${ui('copied')}</span>`; setTimeout(() => cb.innerHTML = `${ICON.copy}<span>${ui('copy')}</span>`, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done)); else fallbackCopy(txt, done); };
}
function fallbackCopy(txt, done) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }

function photoBox(q) { return `<div class="photo"><div class="eyebrow">${ui('photo')}</div><div>${esc(q || '')}</div></div>`; }
function srcs(list) { return list && list.length ? `<details class="srcs"><summary>${ui('sources')}</summary><ul>${list.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul></details>` : ''; }
function paras(txt) { return String(txt || '').split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join(''); }
const related = (ids, label) => ids && ids.length ? `<div class="eyebrow facts-title">${label}</div><div class="related">${ids.map(r => find(r) ? `<button type="button" class="tagbtn" data-open="${esc(r)}">${esc(find(r).name)}</button>` : '').join('')}</div>` : '';
const facts = list => list && list.length ? `<div class="eyebrow facts-title">${ui('facts')}</div><ul class="facts">${list.map(f => `<li>${esc(t(f))}</li>`).join('')}</ul>` : '';
const why = txt => txt ? `<div class="why"><div class="eyebrow">${ui('why')}</div><p>${esc(t(txt))}</p></div>` : '';
const flag = txt => txt ? `<p class="flagnote">${esc(txt)}</p>` : '';

function renderEntry(id) {
  const e = find(id); if (!e) return;
  let html = '';
  if (e.type === 'place') {
    html = `${photoBox(e.image_query)}<h2 class="display">${esc(e.name)}</h2><p class="oneliner">${esc(t(e.one_liner))}</p><div class="meta">${e.address ? `<span class="addr">${esc(e.address)}</span> ${mapLinks(e.address)}` : ''}</div>${e.visit_note ? `<div class="visit"><div class="eyebrow">${ui('visit')}</div>${esc(t(e.visit_note))}</div>` : ''}${flag(e.flag)}<div class="prose">${paras(t(e.body))}</div>${why(e.why_it_matters)}${facts(e.fun_facts)}${related(e.related, ui('company'))}${srcs(e.sources)}`;
  } else if (e.type === 'company') {
    const ppl = DATA.groups.people.filter(p => find(p).company_id === e.id);
    html = `${photoBox(e.logo_query)}<h2 class="display">${esc(e.name)}</h2><p class="oneliner">${esc(t(e.one_liner))}</p><div class="meta">${e.hq ? `<span>${ui('hq')}: ${esc(e.hq)}</span>` : ''}${e.founded ? `<span>${ui('founded')} <span class="num">${esc(e.founded)}</span></span>` : ''}${e.website ? `<a href="${esc(e.website)}" target="_blank" rel="noopener">${ICON.ext}${ui('website')}</a>` : ''}</div>${e.presenting_slot ? `<div class="visit"><div class="eyebrow">${ui('presenting')}</div>${esc(e.presenting_slot)}</div>` : ''}${flag(e.flag)}<div class="prose">${paras(t(e.body))}</div>${why(e.why_it_matters)}${facts(e.fun_facts)}${related(ppl, ui('people'))}${related(e.related, ui('tab-places'))}${srcs(e.sources)}`;
  } else if (e.type === 'person') {
    const co = e.company_id && find(e.company_id);
    html = `${photoBox(e.photo_query)}<h2 class="display">${esc(e.name)}</h2><p class="oneliner">${esc(e.title)}${e.organization ? `, ${esc(e.organization)}` : ''}</p>${e.presenting_slot ? `<div class="visit"><div class="eyebrow">${ui('presenting')}</div>${esc(e.presenting_slot)}</div>` : ''}${flag(e.flag)}<div class="prose">${paras(t(e.body))}</div>${co ? related([co.id], ui('company')) : ''}${e.profile ? `<p><a href="${esc(e.profile)}" target="_blank" rel="noopener">${ICON.ext}${ui('website')}</a></p>` : ''}${srcs(e.sources)}`;
  }
  $('#sheet-crumb').textContent = e.crumb || '';
  $('#sheet-body').innerHTML = html;
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0; document.body.style.overflow = 'hidden';
  $('#sheet-back').focus({ preventScroll: true });
}
function closeSheet() { $('#sheet').hidden = true; document.body.style.overflow = ''; }

function setView(v, push) {
  view = v; store.set('view', v);
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'view-' + v);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  if (push) { try { history.replaceState(null, '', '#' + v); } catch (e) {} }
  window.scrollTo({ top: 0 });
}
function renderAll() { applyUI(); renderSchedule(); renderPlaces(); renderCompanies(); renderPeople(); renderEssentials(); }

document.addEventListener('click', ev => {
  const o = ev.target.closest('[data-open]'); if (o) { renderEntry(o.dataset.open); return; }
  const tab = ev.target.closest('.tab'); if (tab) { setView(tab.dataset.view, true); return; }
});
$('#sheet-back').onclick = closeSheet;
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#lang-en').onclick = () => { lang = 'en'; store.set('lang', lang); renderAll(); };
$('#lang-ja').onclick = () => { lang = 'ja'; store.set('lang', lang); renderAll(); };
$('#open-review').onclick = () => { setView('essentials', true); const el = $('#review-title'); if (el) el.scrollIntoView({ block: 'start' }); };

(function init() {
  const saved = store.get('lang'); if (saved === 'ja' || saved === 'en') lang = saved;
  const ny = nyParts(); const today = DATA.days.find(d => d.date === ny.date);
  dayId = today ? today.id : (store.get('day') || DATA.days[0].id);
  if (!DATA.days.some(d => d.id === dayId)) dayId = DATA.days[0].id;
  const views = ['schedule', 'places', 'companies', 'people', 'essentials'];
  const h = (location.hash || '').replace('#', '');
  const v = views.includes(h) ? h : (store.get('view') || 'schedule');
  renderAll(); setView(views.includes(v) ? v : 'schedule', false);
  setInterval(() => { if (view === 'schedule' && $('#sheet').hidden) renderSchedule(); }, 60000);
})();
</script>

</body></html>
