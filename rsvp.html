<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP, Welcome Drinks</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F2440">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Carlito:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --navy: #0F2440; --wave: #396B8C; --slate: #334155; --cream: #F6F2DC; --ink: #0A2C54;
  --page: #FFFFFF; --card: #FFFFFF; --subtle: #EEF3F7; --heading: #0F2440; --body: #334155; --muted: #64748B; --border: #CBD5E1; --border-soft: #E2E8F0;
  --positive: #2F6B4F; --positive-surface: #E8F1EC; --link: #396B8C;
  --font-display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; --font-body: 'Carlito', 'Calibri', 'Helvetica Neue', Arial, sans-serif; --font-ja: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0F2440; --card: #1A3049; --subtle: #1A3049; --heading: #FFFFFF; --body: rgba(255,255,255,.82); --muted: rgba(255,255,255,.62); --border: rgba(255,255,255,.26); --border-soft: rgba(255,255,255,.14);
  --positive: #9FD3B8; --positive-surface: #173A33; --link: #B4C9D8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0F2440; --card: #1A3049; --subtle: #1A3049; --heading: #FFFFFF; --body: rgba(255,255,255,.82); --muted: rgba(255,255,255,.62); --border: rgba(255,255,255,.26); --border-soft: rgba(255,255,255,.14);
  --positive: #9FD3B8; --positive-surface: #173A33; --link: #B4C9D8; color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--navy); }
body { margin: 0; min-height: 100vh; background: var(--page); color: var(--body); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root[lang="ja"] body, :root[lang="ja"] .display, :root[lang="ja"] .eyebrow, :root[lang="ja"] button { font-family: var(--font-ja); }
:root[lang="ja"] .eyebrow { letter-spacing: .06em; text-transform: none; }
.top { background: var(--navy); color: #fff; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
.top .wrap { display: flex; align-items: center; gap: 12px; }
.top img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
.top .brand { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.top .sub { font-size: 13px; color: rgba(255,255,255,.72); }
.langs { margin-left: auto; display: flex; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; overflow: hidden; }
.langs button { background: none; border: 0; color: rgba(255,255,255,.8); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.langs button.on { background: #fff; color: var(--navy); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }
main { padding: 22px 0 40px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--wave); margin: 0 0 6px; }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; color: var(--heading); line-height: 1.24; font-size: 24px; margin: 0 0 8px; }
.meta { margin: 0 0 18px; color: var(--body); }
.meta b { color: var(--heading); }
.card { border: 1px solid var(--border-soft); border-radius: 14px; background: var(--subtle); padding: 18px 16px; }
.q { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--heading); margin: 0 0 12px; line-height: 1.4; }
:root[lang="ja"] .q { font-family: var(--font-ja); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .02em; padding: 16px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--heading); cursor: pointer; line-height: 1.3; }
:root[lang="ja"] .choice { font-family: var(--font-ja); }
.choice.yes { border-color: var(--positive); color: var(--positive); }
.choice.yes:hover, .choice.yes.sel { background: var(--positive); color: #fff; }
.choice.no:hover, .choice.no.sel { background: var(--slate); border-color: var(--slate); color: #fff; }
.done { font-size: 18px; font-weight: 700; color: var(--positive); margin: 0 0 6px; }
.done.no { color: var(--heading); }
.small { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.fields { display: grid; gap: 10px; margin-top: 14px; }
.fields label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 3px; }
input, select { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--heading); width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 6px; padding: 12px 16px; border: 1px solid var(--border); background: var(--card); color: var(--heading); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%; }
:root[lang="ja"] .btn { font-family: var(--font-ja); letter-spacing: .06em; text-transform: none; }
.btn.primary { background: var(--wave); border-color: var(--wave); color: #fff; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font: inherit; font-size: 14px; border-bottom: 1px solid rgba(57,107,140,.32); }
.guide { margin-top: 18px; }
.foot { margin-top: 26px; font-size: 13px; color: var(--muted); }
.foot a { color: var(--link); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="apple-touch-icon.png" alt="">
  <div><div class="brand" data-i="brand"></div><div class="sub" data-i="sub"></div></div>
  <div class="langs"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button></div>
</div></header>
<main><div class="wrap">
  <p class="eyebrow" data-i="eyebrow"></p>
  <h1 class="display" data-i="title"></h1>
  <p class="meta" data-i="meta"></p>
  <div class="card" id="card"></div>
  <div class="guide"><a class="btn" href="./" data-i="openGuide"></a></div>
  <p class="foot" data-i="foot"></p>
</div></main>
<script>
const UI = {
  en: { brand: 'GWV LP Summit', sub: 'Philadelphia, October 19 to 22, 2026', eyebrow: 'Monday, October 19 · 7:30 PM', title: 'Welcome drinks', meta: '<b>Optional, and a relaxed way to start the week.</b> Planned for SkyHigh, the 60th-floor lounge of the Four Seasons at Comcast Technology Center, a 15-minute walk from The Bellevue. The final venue depends on numbers.',
    q: 'Will you join us?', yes: 'Yes, I will be there', no: 'No, I cannot make it', by: 'Please reply by Friday, October 16. One tap is enough.',
    thanksYes: 'Thank you, you are on the list for Monday.', thanksNo: 'Thank you, noted. We will miss you on Monday.', details: 'Optional: let us know who you are', name: 'Name', company: 'Company', guests: 'People, including you', note: 'Note', send: 'Send', saved: 'Details sent. See you Monday.', savedNo: 'Details sent. Thank you.', change: 'Change my answer', you: 'Your reply',
    openGuide: 'Open the Summit guide', foot: 'Questions? Message Michael Palmer on WhatsApp at +1 410 236 0679 or <a href="mailto:michael@greatwave.vc">michael@greatwave.vc</a>.' },
  ja: { brand: 'GWV LPサミット', sub: 'フィラデルフィア、2026年10月19日〜22日', eyebrow: '10月19日（月）19:30', title: 'ウェルカムドリンク', meta: '<b>任意参加です。</b>コムキャスト・テクノロジー・センター60階、フォーシーズンズのラウンジ「SkyHigh」を予定しています（ベルビュー・ホテルから徒歩15分）。会場は参加人数により決定します。',
    q: 'ご参加いただけますか？', yes: '参加します', no: '欠席します', by: '10月16日（金）までにご回答ください。ワンタップで完了します。',
    thanksYes: 'ありがとうございます。参加で承りました。', thanksNo: 'ありがとうございます。欠席で承りました。', details: '任意：お名前をお知らせください', name: 'お名前', company: '会社名', guests: '人数（ご本人を含む）', note: 'メモ', send: '送信', saved: '送信しました。月曜日にお会いしましょう。', savedNo: '送信しました。ありがとうございます。', change: '回答を変更する', you: 'ご回答',
    openGuide: 'サミットガイドを開く', foot: 'ご不明な点は Michael Palmer まで。WhatsApp +1 410 236 0679 または <a href="mailto:michael@greatwave.vc">michael@greatwave.vc</a>' }
};
const RSVP_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSc4yypnsCcTdTktMFdvGDUFFLDYAwQiKpCJzS15bedTAYCneQ/formResponse';
const RSVP_F = { answer: 'entry.1947673763', name: 'entry.1226666171', company: 'entry.587533030', guests: 'entry.1156643904', note: 'entry.1888502271', source: 'entry.1842800084', rid: 'entry.246701770' };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
let lang = 'en';
const saved = store.get('lang'); const pl = params.get('lang');
if (pl === 'ja' || pl === 'en') lang = pl; else if (saved === 'ja' || saved === 'en') lang = saved; else if (/^ja/i.test(navigator.language || '')) lang = 'ja';
const ui = k => UI[lang][k] || UI.en[k] || k;
let mem = {};
function state() { try { return JSON.parse(store.get('rsvp') || 'null') || mem; } catch (e) { return mem; } }
function save(s) { mem = s; store.set('rsvp', JSON.stringify(s)); }
function rid() { const s = state(); if (s.rid) return s.rid; s.rid = Math.random().toString(36).slice(2, 10); save(s); return s.rid; }
function send(fields) { const body = new URLSearchParams(); Object.keys(fields).forEach(k => { if (fields[k] != null && fields[k] !== '' && RSVP_F[k]) body.append(RSVP_F[k], String(fields[k])); }); try { return fetch(RSVP_FORM, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}); } catch (e) { return Promise.resolve(); } }
function answer(a, source) { const s = state(); s.rid = rid(); s.answer = a; s.ts = Date.now(); delete s.details; save(s); send({ answer: a, source, rid: s.rid }); }
function details(root) {
  const s = state(); const v = n => { const el = root.querySelector(`[data-f="${n}"]`); return el ? el.value.trim() : ''; };
  s.details = { name: v('name'), company: v('company'), guests: v('guests'), note: v('note') }; save(s);
  send({ answer: s.answer, name: s.details.name, company: s.details.company, guests: s.answer === 'yes' ? s.details.guests : '', note: s.details.note, source: 'email-details', rid: s.rid });
}
function card() {
  const s = state();
  if (!s.answer) return `<p class="q">${ui('q')}</p><div class="choices"><button type="button" class="choice yes" data-rsvp="yes">${ui('yes')}</button><button type="button" class="choice no" data-rsvp="no">${ui('no')}</button></div><p class="small">${ui('by')}</p>`;
  const yes = s.answer === 'yes';
  const head = `<p class="done${yes ? '' : ' no'}">${yes ? ui('thanksYes') : ui('thanksNo')}</p>`;
  if (s.details) {
    const d = s.details; const who = [d.name, d.company].filter(Boolean).join(', ');
    return `${head}<p class="small">${ui('you')}: <b>${yes ? ui('yes') : ui('no')}</b>${who ? ` &middot; ${esc(who)}` : ''}${yes && d.guests ? ` &middot; ${esc(d.guests)}` : ''}</p><p class="small">${yes ? ui('saved') : ui('savedNo')} <button type="button" class="linkbtn" data-rsvp-change>${ui('change')}</button></p>`;
  }
  const guests = yes ? `<div><label>${ui('guests')}</label><select data-f="guests">${[1,2,3,4,5].map(n => `<option value="${n}">${n}</option>`).join('')}</select></div>` : '';
  return `${head}<p class="small">${ui('details')}</p><div class="fields"><div class="row2"><div><label>${ui('name')}</label><input type="text" data-f="name" autocomplete="name"></div><div><label>${ui('company')}</label><input type="text" data-f="company" autocomplete="organization"></div></div><div class="row2">${guests}<div><label>${ui('note')}</label><input type="text" data-f="note"></div></div><button type="button" class="btn primary" data-rsvp-send>${ui('send')}</button></div><p class="small"><button type="button" class="linkbtn" data-rsvp-change>${ui('change')}</button></p>`;
}
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = ui(el.dataset.i); });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.getElementById('card').innerHTML = card();
}
document.addEventListener('click', ev => {
  const l = ev.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; store.set('lang', lang); render(); return; }
  const ra = ev.target.closest('[data-rsvp]'); if (ra) { answer(ra.dataset.rsvp, 'page'); render(); return; }
  const rs = ev.target.closest('[data-rsvp-send]'); if (rs) { details(document.getElementById('card')); render(); return; }
  const rc = ev.target.closest('[data-rsvp-change]'); if (rc) { const s = state(); save({ rid: s.rid }); render(); return; }
});
// One tap from the email: ?a=yes or ?a=no records the answer as soon as the page opens.
const a = (params.get('a') || '').toLowerCase();
if (a === 'yes' || a === 'no') { answer(a, 'email'); history.replaceState(null, '', location.pathname + (pl ? '?lang=' + pl : '')); }
render();
</script>
</body>
</html>
